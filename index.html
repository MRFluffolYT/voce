<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Slide Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7;
  --surface: rgba(255,255,255,0.72);
  --surface-solid: #ffffff;
  --surface2: rgba(255,255,255,0.5);
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.05);
  --text: #1d1d1f;
  --text2: #6e6e73;
  --text3: #aeaeb2;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0,113,227,0.1);
  --red: #ff3b30;
  --green: #34c759;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 2px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --blur: blur(20px) saturate(180%);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}

- { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
font-family: var(–font);
background: var(–bg);
color: var(–text);
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* ── SCROLLBAR ─────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

/* ── HEADER ────────────────────────────────────── */
#header {
flex-shrink: 0;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 24px;
height: 56px;
background: rgba(245,245,247,0.8);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border-bottom: 1px solid var(–border);
z-index: 100;
}

.logo {
font-size: 17px;
font-weight: 700;
letter-spacing: -0.5px;
color: var(–text);
display: flex;
align-items: center;
gap: 8px;
}
.logo-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: var(–accent);
}
.logo-dot.live {
animation: livePulse 2s ease-in-out infinite;
}
@keyframes livePulse {
0%,100% { opacity:1; transform:scale(1); }
50% { opacity:0.4; transform:scale(0.7); }
}

#headerRight {
display: flex;
align-items: center;
gap: 12px;
}
.hpill {
display: flex;
align-items: center;
gap: 6px;
background: var(–surface2);
backdrop-filter: var(–blur);
border: 1px solid var(–border);
border-radius: 20px;
padding: 4px 12px;
font-size: 12px;
font-weight: 500;
color: var(–text2);
}
.hpill b { color: var(–text); font-weight: 600; }
#livePill {
display: none;
background: rgba(52,199,89,0.1);
border-color: rgba(52,199,89,0.2);
color: #1a7a32;
}
#livePill.show { display: flex; }
.live-dot {
width: 6px; height: 6px; border-radius: 50%;
background: var(–green);
animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── MAIN LAYOUT ───────────────────────────────── */
#main {
flex: 1;
display: flex;
overflow: hidden;
gap: 0;
}

/* ── SLIDE AREA ────────────────────────────────── */
#slideArea {
flex: 1;
display: flex;
flex-direction: column;
padding: 20px;
gap: 14px;
overflow: hidden;
min-width: 0;
}

#slideStage {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
min-height: 0;
}

#slideFrame {
width: 100%;
max-width: 820px;
aspect-ratio: 16/9;
border-radius: var(–radius);
overflow: hidden;
box-shadow: var(–shadow-lg);
position: relative;
background: #fff;
transition: box-shadow 0.4s ease, transform 0.4s ease;
}
#slideFrame.gen {
box-shadow: 0 0 0 2px var(–accent), var(–shadow-lg);
}

#slideCanvas {
width: 100%; height: 100%;
transition: opacity 0.2s ease;
}
#slideCanvas.fade { opacity: 0; transform: scale(0.98); }
#slideCanvas.visible { opacity: 1; transform: scale(1); transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.16,1,.3,1); }

#genOverlay {
display: none;
position: absolute; inset: 0;
background: rgba(255,255,255,0.7);
backdrop-filter: blur(10px);
align-items: center; justify-content: center;
flex-direction: column; gap: 12px;
border-radius: var(–radius);
}
#genOverlay.show { display: flex; }
.gen-spinner {
width: 28px; height: 28px;
border: 2.5px solid rgba(0,113,227,0.15);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#genOverlay p {
font-size: 13px; font-weight: 500;
color: var(–accent);
letter-spacing: -0.2px;
}

/* ── THUMBNAILS ────────────────────────────────── */
#thumbs {
display: flex;
gap: 10px;
overflow-x: auto;
padding: 4px 2px;
flex-shrink: 0;
scrollbar-width: none;
}
#thumbs::-webkit-scrollbar { display:none; }

.thumb {
flex-shrink: 0;
width: 120px; height: 68px;
border-radius: 10px;
overflow: hidden;
cursor: pointer;
border: 2px solid transparent;
position: relative;
transition: all 0.2s ease;
background: #fff;
box-shadow: var(–shadow);
}
.thumb:hover { transform: translateY(-2px); box-shadow: var(–shadow-lg); }
.thumb.active { border-color: var(–accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.18); }
.tprev { width:120px; height:68px; position:relative; overflow:hidden; }
.tscale {
position:absolute; top:0; left:0;
width:820px; height:461px;
transform: scale(0.1463);
transform-origin: top left;
pointer-events:none;
}
.tnum {
position: absolute; bottom: 4px; right: 5px;
font-size: 9px; font-weight: 600;
color: rgba(255,255,255,0.9);
background: rgba(0,0,0,0.35);
padding: 1px 5px; border-radius: 4px;
backdrop-filter: blur(4px);
}

/* ── RIGHT PANEL ───────────────────────────────── */
#right {
width: 300px;
flex-shrink: 0;
border-left: 1px solid var(–border);
background: rgba(245,245,247,0.6);
backdrop-filter: var(–blur);
display: flex;
flex-direction: column;
overflow: hidden;
}

.panel-section {
padding: 16px 16px 14px;
border-bottom: 1px solid var(–border);
}
.panel-label {
font-size: 11px;
font-weight: 600;
color: var(–text3);
letter-spacing: 0.5px;
text-transform: uppercase;
margin-bottom: 12px;
}

/* ── MIC ───────────────────────────────────────── */
#micCenter {
display: flex;
flex-direction: column;
align-items: center;
gap: 12px;
}

#micBtn {
width: 72px; height: 72px;
border-radius: 50%;
border: none;
background: var(–surface-solid);
box-shadow: var(–shadow-lg);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 28px;
transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
position: relative;
}
#micBtn:hover { transform: scale(1.06); }
#micBtn:active { transform: scale(0.94); }
#micBtn.on {
background: var(–accent);
box-shadow: 0 0 0 8px rgba(0,113,227,0.15), var(–shadow-lg);
}
#micBtn.on::before {
content:’’;
position:absolute; inset:-8px;
border-radius:50%;
border:1px solid rgba(0,113,227,0.25);
animation:micRipple 2s ease-out infinite;
}
#micBtn.on::after {
content:’’;
position:absolute; inset:-16px;
border-radius:50%;
border:1px solid rgba(0,113,227,0.12);
animation:micRipple 2s ease-out 0.6s infinite;
}
@keyframes micRipple {
0%{ opacity:1; transform:scale(0.85); }
100%{ opacity:0; transform:scale(1.3); }
}

#waveform {
display:flex; gap:3px; align-items:center; height:24px;
}
.wbar {
width:3px; border-radius:3px;
background: var(–text3);
height:4px;
transition:height 0.12s ease, background 0.3s;
}
#waveform.on .wbar {
background: var(–accent);
}

#micLabel {
font-size: 12px;
font-weight: 500;
color: var(–text2);
letter-spacing: -0.2px;
}
#micLabel.on { color: var(–accent); }

/* ── AUTO INTERVAL TOGGLE ──────────────────────── */
#autoRow {
display: flex;
align-items: center;
justify-content: space-between;
margin-top: 4px;
}
.auto-label {
font-size: 12px;
font-weight: 500;
color: var(–text2);
}
/* iOS toggle */
.toggle-wrap { display:flex; align-items:center; gap:8px; }
.toggle {
width:40px; height:24px;
background:#d1d1d6;
border-radius:12px;
position:relative;
cursor:pointer;
transition:background 0.25s;
flex-shrink:0;
}
.toggle.on { background:var(–accent); }
.toggle::after {
content:’’;
position:absolute;
top:2px; left:2px;
width:20px; height:20px;
border-radius:50%;
background:#fff;
box-shadow:0 1px 4px rgba(0,0,0,0.2);
transition:transform 0.25s cubic-bezier(.34,1.56,.64,1);
}
.toggle.on::after { transform:translateX(16px); }
.countdown {
font-size:11px; font-weight:600;
color:var(–accent);
font-variant-numeric:tabular-nums;
min-width:20px;
display:none;
}
.countdown.show { display:block; }

/* ── MANUAL INPUT ──────────────────────────────── */
#manualSection {
padding: 10px 16px;
border-bottom: 1px solid var(–border);
}
#manualRow {
display: flex; gap: 8px;
}
#manualInput {
flex:1;
background: var(–surface-solid);
border: 1px solid var(–border);
color: var(–text);
padding: 9px 13px;
border-radius: var(–radius-sm);
font-size: 13px;
font-family: var(–font);
outline: none;
transition: border-color 0.2s;
box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
}
#manualInput:focus { border-color: var(–accent); box-shadow: 0 0 0 3px var(–accent-soft), inset 0 1px 3px rgba(0,0,0,0.04); }
#sendBtn {
background: var(–accent);
color: #fff; border: none;
padding: 9px 14px; border-radius: var(–radius-sm);
cursor: pointer; font-size: 14px; font-weight: 600;
font-family: var(–font);
transition: all 0.2s;
white-space: nowrap;
}
#sendBtn:hover { background: var(–accent-hover); }
#sendBtn:active { transform: scale(0.95); }

/* ── LOG ───────────────────────────────────────── */
.log-label {
font-size:11px; font-weight:600; color:var(–text3);
letter-spacing:0.5px; text-transform:uppercase;
padding:10px 16px 4px;
}
#logBox {
flex:1;
overflow-y:auto;
padding:0 0 8px;
}
.logEntry {
padding: 8px 16px;
border-bottom: 1px solid var(–border2);
transition: background 0.15s;
}
.logEntry:hover { background: rgba(255,255,255,0.5); }
.logMeta { display:flex; gap:6px; align-items:center; margin-bottom:3px; }
.logTime { font-size:10px; font-weight:500; color:var(–text3); font-variant-numeric:tabular-nums; }
.logBadge {
font-size:9px; padding:1px 6px;
border-radius:6px; font-weight:600;
letter-spacing:0.3px;
}
.logBadge.voice { background:rgba(0,113,227,0.08); color:var(–accent); }
.logBadge.slide { background:rgba(52,199,89,0.1); color:#1a7a32; }
.logText { font-size:12px; color:var(–text2); line-height:1.45; }

/* ── CONTROLS ──────────────────────────────────── */
#controls {
padding: 10px 16px;
border-top: 1px solid var(–border);
display: flex; gap:8px;
}
.ctrlBtn {
flex:1; padding:8px 12px;
background: var(–surface-solid);
border: 1px solid var(–border);
color: var(–text2);
border-radius: var(–radius-sm);
cursor: pointer;
font-family: var(–font);
font-size: 12px; font-weight: 500;
transition: all 0.2s;
}
.ctrlBtn:hover { background:#fff; color:var(–text); box-shadow:var(–shadow); }
.ctrlBtn.danger:hover { border-color:rgba(255,59,48,0.3); color:var(–red); background:rgba(255,59,48,0.05); }

/* ── EMPTY STATE ───────────────────────────────── */
#emptyState {
width:100%; height:100%;
background:#fafafa;
display:flex; flex-direction:column;
align-items:center; justify-content:center;
gap:10px;
}
.empty-icon { font-size:36px; opacity:0.35; }
.empty-title { font-size:15px; font-weight:600; color:var(–text2); }
.empty-sub { font-size:13px; color:var(–text3); text-align:center; max-width:200px; line-height:1.4; }

/* ── SLIDE THEMES (Apple Keynote inspired) ─────── */
/* See JS for inline-style rendering */

/* ── MOBILE ────────────────────────────────────── */
@media (max-width: 700px) {
#main { flex-direction: column; }

#slideArea {
padding: 12px 12px 8px;
gap:10px;
flex: 1;
min-height: 0;
}

#right {
width: 100%;
border-left: none;
border-top: 1px solid var(–border);
flex-direction: row;
height: 160px;
flex-shrink: 0;
background: rgba(245,245,247,0.95);
}

.panel-section { border-bottom:none; border-right:1px solid var(–border); padding:12px; }
#micCenter { gap:8px; }
#micBtn { width:56px; height:56px; font-size:22px; }
#waveform { display:none; }
#autoRow { display:none; }

#manualSection {
flex:1;
border-bottom:none;
border-right:1px solid var(–border);
display:flex;
flex-direction:column;
justify-content:center;
padding:12px;
}

.log-label { display:none; }
#logBox { display:none; }

#controls {
flex-direction:column;
padding:10px;
border-top:none;
justify-content:center;
gap:6px;
min-width:80px;
}

#header { padding:0 16px; }
.hpill { padding:3px 9px; font-size:11px; }

#thumbs { min-height:58px; }
.thumb { width:96px; height:54px; }
.tprev { width:96px; height:54px; }
.tscale { width:820px; height:461px; transform:scale(0.117); }
}

@media (max-width:400px) {
#right { height:140px; }
#controls { display:none; }
}
</style>

</head>

<script>
// ── CONFIG ─────────────────────────────────────
const GROQ_KEY   = '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';
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const LIVE_INTERVAL = 15; // seconds between auto-updates while listening

// ── APPLE KEYNOTE THEMES ───────────────────────
const THEMES = [
  // White minimal
  { bg:'#ffffff', h1:'#1d1d1f', h2:'#6e6e73', accent:'#0071e3', card:'#f5f5f7', tag:'#0071e3' },
  // Midnight
  { bg:'#1d1d1f', h1:'#f5f5f7', h2:'#a1a1a6', accent:'#2997ff', card:'#2c2c2e', tag:'#2997ff' },
  // Ink blue
  { bg:'#001d3d', h1:'#ffffff', h2:'#90c2e7', accent:'#ffd60a', card:'rgba(255,255,255,0.07)', tag:'#ffd60a' },
  // Warm sand
  { bg:'#faf5eb', h1:'#2c2c2c', h2:'#7a6a52', accent:'#d97706', card:'#fff8e7', tag:'#d97706' },
  // Forest
  { bg:'#1a2e1a', h1:'#f0faf0', h2:'#86c88a', accent:'#34c759', card:'rgba(255,255,255,0.07)', tag:'#34c759' },
  // Graphite
  { bg:'#2c2c2e', h1:'#f5f5f7', h2:'#98989d', accent:'#ff9f0a', card:'#3a3a3c', tag:'#ff9f0a' },
  // Blush
  { bg:'#fff0f3', h1:'#1d1d1f', h2:'#86566e', accent:'#ff2d55', card:'#ffe4ea', tag:'#ff2d55' },
  // Slate
  { bg:'#0a0a0f', h1:'#ffffff', h2:'#8e8e93', accent:'#bf5af2', card:'rgba(255,255,255,0.06)', tag:'#bf5af2' },
];

const TI = ['✦','◆','⬡','○','▲','⬤','◉','★'];
const SI = ['↑','%','×','→','⚡','◎','≈','∞'];

// ── STATE ──────────────────────────────────────
let slides=[], curIdx=-1;
let isListening=false, isGenerating=false;
let recognition=null, accText='', silenceTimer=null;
let autoEnabled=true, autoTimer=null, autoCountdown=0, countdownTimer=null;
const t0=Date.now();

// ── TIMER ──────────────────────────────────────
setInterval(()=>{
  const e=Math.floor((Date.now()-t0)/1000);
  document.getElementById('timerPill').textContent=
    String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
},1000);

// ── WAVEFORM ───────────────────────────────────
setInterval(()=>{
  if(!isListening)return;
  document.querySelectorAll('.wbar').forEach(b=>{
    b.style.height=(3+Math.random()*16)+'px';
  });
},100);

// ── SPEECH ─────────────────────────────────────
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('micLabel').textContent='Usa il campo testo';
    const btn=document.getElementById('micBtn');
    btn.style.opacity='.3';btn.onclick=null;
    return;
  }
  recognition=new SR();
  recognition.lang='it-IT';
  recognition.continuous=true;
  recognition.interimResults=true;

  recognition.onresult=ev=>{
    let fin='';
    for(let i=ev.resultIndex;i<ev.results.length;i++)
      if(ev.results[i].isFinal)fin+=ev.results[i][0].transcript;
    if(!fin)return;
    accText+=' '+fin.trim();
    addLog(fin.trim(),'voice');
    // Manual silence trigger (short silence)
    clearTimeout(silenceTimer);
    silenceTimer=setTimeout(()=>{
      const t=accText.trim();
      if(t.length>6&&!isGenerating){accText='';generateSlide(t);}
    },2200);
  };

  recognition.onerror=ev=>{
    if(ev.error==='not-allowed'){
      document.getElementById('micLabel').textContent='Microfono non autorizzato';
      setMicUI(false);
    }
  };
  recognition.onend=()=>{ if(isListening)try{recognition.start();}catch(_){} };
})();

function toggleMic(){
  if(!recognition)return;
  isListening?stopMic():startMic();
}
function startMic(){
  isListening=true;
  try{recognition.start();}catch(_){}
  setMicUI(true);
  document.getElementById('logoDot').classList.add('live');
  document.getElementById('livePill').classList.add('show');
  if(autoEnabled)startAutoTimer();
}
function stopMic(){
  isListening=false;
  try{recognition.stop();}catch(_){}
  setMicUI(false);
  clearTimeout(silenceTimer);
  stopAutoTimer();
  document.getElementById('logoDot').classList.remove('live');
  document.getElementById('livePill').classList.remove('show');
  const t=accText.trim();
  if(t.length>6&&!isGenerating){accText='';generateSlide(t);}
}
function setMicUI(on){
  const btn=document.getElementById('micBtn');
  const lbl=document.getElementById('micLabel');
  const wv=document.getElementById('waveform');
  btn.className=on?'on':'';
  btn.textContent=on?'⏹':'🎤';
  wv.className=on?'on':'';
  lbl.textContent=on?'In ascolto…':'Tocca per parlare';
  lbl.className=on?'on':'';
  if(!on)document.querySelectorAll('.wbar').forEach(b=>b.style.height='4px');
}

// ── AUTO LIVE UPDATE ────────────────────────────
function toggleAuto(){
  autoEnabled=!autoEnabled;
  document.getElementById('autoToggle').className='toggle'+(autoEnabled?' on':'');
  if(autoEnabled&&isListening)startAutoTimer();
  else stopAutoTimer();
}

function startAutoTimer(){
  stopAutoTimer();
  autoCountdown=LIVE_INTERVAL;
  const cdEl=document.getElementById('countdown');
  cdEl.classList.add('show');
  cdEl.textContent=autoCountdown+'s';
  countdownTimer=setInterval(()=>{
    autoCountdown--;
    cdEl.textContent=autoCountdown+'s';
    if(autoCountdown<=0){
      cdEl.textContent=LIVE_INTERVAL+'s';
      autoCountdown=LIVE_INTERVAL;
      // Trigger auto-slide from accumulated text
      const t=accText.trim();
      if(t.length>6&&!isGenerating){
        accText='';
        clearTimeout(silenceTimer);
        generateSlide(t);
      }
    }
  },1000);
}

function stopAutoTimer(){
  clearInterval(countdownTimer);
  const cdEl=document.getElementById('countdown');
  cdEl.classList.remove('show');
  autoCountdown=0;
}

// ── MANUAL ─────────────────────────────────────
function sendManual(){
  const inp=document.getElementById('manualInput');
  const t=inp.value.trim();
  if(!t||isGenerating)return;
  inp.value='';
  addLog(t,'voice');
  generateSlide(t);
}

// ── GROQ API ───────────────────────────────────
async function generateSlide(text){
  isGenerating=true;
  document.getElementById('slideFrame').classList.add('gen');
  document.getElementById('genOverlay').classList.add('show');

  const sys=`Sei un generatore di slide visive professionali stile Apple Keynote.
Rispondi SOLO con JSON valido. Zero testo extra. Zero markdown.
Schema rigoroso:
{
  "type": "title|bullets|stats|quote|image",
  "tag": "KEYWORD BREVE",
  "title": "Titolo massimo 6 parole, impatto alto",
  "subtitle": "Frase descrittiva max 16 parole (solo title/image)",
  "bullets": ["punto conciso 1","punto 2","punto 3","punto 4"],
  "stats": [{"value":"87%","label":"Efficienza"},{"value":"3×","label":"Crescita"},{"value":"24h","label":"Risposta"}],
  "quote": "Citazione breve e incisiva"
}
Regole di scelta tipo:
- title → introduzioni, soggetti nuovi
- bullets → processi, liste, vantaggi (max 4)
- stats → dati, numeri, metriche (max 3 stat)
- quote → principi, filosofia, motto
- image → luoghi, prodotti, persone
Italiano. Specifico. Denso di valore.`;

  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({
        model:GROQ_MODEL,max_tokens:600,temperature:0.65,
        messages:[
          {role:'system',content:sys},
          {role:'user',content:'Slide Keynote per: "'+text+'"'}
        ]
      })
    });
    const data=await res.json();
    const raw=(data.choices?.[0]?.message?.content||'').replace(/```json|```/g,'').trim();
    let parsed;
    try{parsed=JSON.parse(raw);}
    catch{parsed={type:'title',tag:'LIVE',title:text.split(' ').slice(0,5).join(' '),subtitle:text};}
    pushSlide(parsed,text);
    addLog('Slide: "'+parsed.title+'"','slide');
  }catch(err){
    const fb={type:'title',tag:'LIVE',title:text.split(' ').slice(0,5).join(' ')||'Slide',subtitle:text};
    pushSlide(fb,text);
  }

  isGenerating=false;
  document.getElementById('slideFrame').classList.remove('gen');
  document.getElementById('genOverlay').classList.remove('show');
}

// ── SLIDE PUSH ─────────────────────────────────
function pushSlide(data,text){
  slides.push({data,text});
  curIdx=slides.length-1;
  document.getElementById('slideCount').textContent=slides.length;
  renderMain(curIdx,true);
  addThumb(curIdx);
}

// ── RENDER MAIN ────────────────────────────────
function renderMain(idx,animate){
  const c=document.getElementById('slideCanvas');
  if(animate){
    c.className='fade';
    setTimeout(()=>{
      c.innerHTML=buildHTML(slides[idx].data,idx);
      c.className='visible';
    },180);
  } else {
    c.innerHTML=buildHTML(slides[idx].data,idx);
    c.className='visible';
  }
}

// ── HTML BUILDERS ──────────────────────────────
function buildHTML(d,idx){
  const t=THEMES[idx%THEMES.length];
  switch(d.type){
    case'bullets':return hBullets(d,t,idx);
    case'stats':  return hStats(d,t,idx);
    case'quote':  return hQuote(d,t,idx);
    case'image':  return hImage(d,t,idx);
    default:      return hTitle(d,t,idx);
  }
}

function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// TITLE SLIDE — clean Apple hero layout

  const isLight=isLightBg(t.bg);

  <!-- subtle grid pattern -->
  <div style="position:absolute;inset:0;background-image:radial-gradient(${isLight?'rgba(0,0,0,0.04)':'rgba(255,255,255,0.03)'} 1px,transparent 1px);background-size:28px 28px;"></div>
  <!-- accent blob -->
  <div style="position:absolute;top:-80px;right:-80px;width:320px;height:320px;border-radius:50%;background:${t.accent}12;filter:blur(40px);"></div>

    <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:${t.accent};text-transform:uppercase;">${x(d.tag||'LIVE')}</span>

  ${d.subtitle?`<p style="font-size:clamp(12px,1.6vw,17px);color:${t.h2};line-height:1.55;max-width:460px;font-weight:400;position:relative;z-index:1;">${x(d.subtitle)}</p>`:''}
  <!-- bottom line -->

    <div style="width:28px;height:28px;border-radius:8px;background:${t.accent}18;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:${t.accent};margin-top:1px;">${i+1}</div>
    <div style="font-size:clamp(12px,1.4vw,15px);color:${t.h1};line-height:1.5;font-weight:400;padding-top:5px;opacity:0.85;">${x(b)}</div>

    <h2 style="font-size:clamp(16px,2.2vw,26px);font-weight:700;color:${t.h1};letter-spacing:-0.8px;line-height:1.1;">${x(d.title)}</h2>
  </div>
  <!-- bullets -->
  <div style="flex:1;padding:4px 36px 16px;display:flex;flex-direction:column;justify-content:center;">${rows}</div>
  <!-- accent left border -->
  <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,${t.accent},${t.accent}00);border-radius:0 0 0 0;"></div>
</div>`;}

// STATS SLIDE
function hStats(d,t,idx){
  const stats=(d.stats||[]).slice(0,3);
  const cards=stats.map((s,i)=>`
  <div style="flex:1;min-width:80px;background:${t.card};border-radius:16px;padding:20px 14px;text-align:center;border:1px solid ${isLightBg(t.bg)?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.06)'};">
    <div style="font-size:clamp(28px,4vw,44px);font-weight:800;color:${t.accent};letter-spacing:-2px;line-height:1;">${x(s.value)}</div>
    <div style="font-size:10px;font-weight:600;color:${t.h2};letter-spacing:0.8px;text-transform:uppercase;margin-top:8px;">${x(s.label)}</div>
  </div>`).join('');

  <div style="position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:${t.accent}10;filter:blur(30px);"></div>
  <div style="margin-bottom:20px;">
    <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:${t.accent};text-transform:uppercase;margin-bottom:6px;">${x(d.tag||'DATI')}</div>
    <h2 style="font-size:clamp(16px,2.2vw,26px);font-weight:700;color:${t.h1};letter-spacing:-0.8px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:12px;position:relative;z-index:1;">${cards}</div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,${t.accent},${t.accent}00);"></div>
</div>`;}

// QUOTE SLIDE
function hQuote(d,t,idx){
  const q=d.quote||d.title;
  const author=(d.quote&&d.title)?d.title:null;
  return`<div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 60px;font-family:'Inter',-apple-system,sans-serif;position:relative;overflow:hidden;text-align:center;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,${t.accent}0e 0%,transparent 70%);"></div>

  <p style="font-size:clamp(16px,2.4vw,26px);font-weight:500;color:${t.h1};line-height:1.55;max-width:520px;font-style:italic;position:relative;z-index:1;letter-spacing:-0.3px;">${x(q)}</p>

  <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:${t.accent};text-transform:uppercase;margin-top:16px;position:relative;z-index:1;opacity:0.7;">${x(d.tag||'CITAZIONE')}</div>
</div>`;}

// IMAGE/SPLIT SLIDE
function hImage(d,t,idx){
  const emos=['🌐','🧠','💼','🏆','🔬','📱','🎨','⚙️','🌍','📡'];
  const em=emos[idx%emos.length];
  const bullets=(d.bullets||[]).slice(0,3).map(b=>`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
    <div style="width:5px;height:5px;border-radius:50%;background:${t.accent};flex-shrink:0;opacity:0.7;"></div>
    <span style="font-size:clamp(11px,1.25vw,14px);color:${t.h2};">${x(b)}</span>
  </div>`).join('');
  return`<div style="width:100%;height:100%;background:${t.bg};display:flex;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;">

  <div style="width:36%;background:${t.accent};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 20px;flex-shrink:0;position:relative;overflow:hidden;">
    <div style="position:absolute;top:-40px;left:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.12);"></div>

    <div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.75);font-weight:700;text-transform:uppercase;z-index:1;">${x(d.tag||'LIVE')}</div>
  </div>
  <!-- right content -->
  <div style="flex:1;padding:28px 32px;display:flex;flex-direction:column;justify-content:center;">
    <h2 style="font-size:clamp(15px,2.2vw,24px);font-weight:700;color:${t.h1};margin-bottom:10px;letter-spacing:-0.6px;line-height:1.2;">${x(d.title)}</h2>
    ${d.subtitle?`<p style="font-size:clamp(11px,1.3vw,14px);color:${t.h2};line-height:1.55;margin-bottom:14px;">${x(d.subtitle)}</p>`:''}
    ${bullets}
  </div>
</div>`;}

function isLightBg(hex){
  if(!hex||hex[0]!=='#')return true;
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return(0.299*r+0.587*g+0.114*b)/255>0.55;
}

// ── THUMBNAIL ──────────────────────────────────
function addThumb(idx){
  const container=document.getElementById('thumbs');
  container.querySelectorAll('.thumb').forEach(el=>el.classList.remove('active'));

  const wrap=document.createElement('div');
  wrap.className='thumb active';
  wrap.onclick=()=>selectSlide(idx);

  const prev=document.createElement('div');
  prev.className='tprev';
  const scale=document.createElement('div');
  scale.className='tscale';
  scale.innerHTML=buildHTML(slides[idx].data,idx);
  prev.appendChild(scale);
  wrap.appendChild(prev);

  const num=document.createElement('div');
  num.className='tnum';num.textContent=idx+1;
  wrap.appendChild(num);

  container.appendChild(wrap);
  wrap.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'});
}

function selectSlide(idx){
  curIdx=idx;
  renderMain(idx,true);
  document.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i===idx));
}

// ── LOG ────────────────────────────────────────
function addLog(text,type){
  const box=document.getElementById('logBox');
  const now=new Date();
  const time=[now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  const el=document.createElement('div');
  el.className='logEntry';
  el.innerHTML=`<div class="logMeta"><span class="logTime">${time}</span><span class="logBadge ${type}">${type==='voice'?'Voce':'✦ Slide'}</span></div><div class="logText">${x(text.substring(0,80))}</div>`;
  box.appendChild(el);
  box.scrollTop=99999;
}

// ── RESET ──────────────────────────────────────
function clearAll(){
  slides=[];curIdx=-1;accText='';
  document.getElementById('slideCount').textContent='0';
  document.getElementById('slideCanvas').innerHTML=`<div id="emptyState"><div class="empty-icon">🎤</div><div class="empty-title">Inizia a parlare</div><div class="empty-sub">Premi il microfono e la slide apparirà in automatico</div></div>`;
  document.getElementById('slideCanvas').className='visible';
  document.getElementById('thumbs').innerHTML='';
  document.getElementById('logBox').innerHTML='';
  if(isListening)stopMic();
}
