<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Slide Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eeeae4;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --accent:#0071e3;
  --red:#ff3b30;
  --green:#34c759;
  --orange:#ff9f0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);}
body{
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:22px 22px 108px;
}

/* ── SLIDE ───────────────────────────────── */
#slideWrap{
width:100%;max-width:1080px;aspect-ratio:16/9;
border-radius:22px;overflow:hidden;
box-shadow:0 14px 64px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.07);
background:#fff;position:relative;flex-shrink:0;
border:2px solid transparent;
transition:border-color .25s,box-shadow .25s;
}
#slideWrap.thinking{
border-color:rgba(0,113,227,.35);
box-shadow:0 0 0 4px rgba(0,113,227,.08),0 14px 64px rgba(0,0,0,.16);
}

/* slide content — fades between slides */
#slide{
width:100%;height:100%;
opacity:1;
transition:opacity .22s ease, transform .28s cubic-bezier(.16,1,.3,1);
}
#slide.out{opacity:0;transform:scale(.97);}

/* ── THINKING INDICATOR ──────────────────── */
#thinkBar{
position:absolute;bottom:0;left:0;right:0;height:3px;
background:transparent;overflow:hidden;display:none;z-index:10;
}
#thinkBar.show{display:block;}
#thinkBar::after{
content:’’;display:block;height:100%;width:40%;
background:linear-gradient(90deg,transparent,var(–accent),transparent);
animation:sweep 1s ease-in-out infinite;
}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(350%)}}

/* ── TRANSCRIPT BAR (shows what mic hears) ─ */
#transcriptBar{
position:absolute;bottom:0;left:0;right:0;
padding:10px 20px;
background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 100%);
font-size:clamp(12px,1.6vw,17px);
color:rgba(255,255,255,.9);
font-weight:500;
letter-spacing:-.2px;
line-height:1.4;
min-height:48px;
display:flex;align-items:flex-end;
opacity:0;
transition:opacity .3s;
z-index:5;
pointer-events:none;
}
#transcriptBar.show{opacity:1;}
#transcriptText{
flex:1;
/* show last portion of text, latest words visible */
overflow:hidden;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
}
/* interim (unconfirmed) text is dimmer */
#interimSpan{opacity:.55;font-style:italic;}

/* ── BADGES top-left ─────────────────────── */
#badge{
position:absolute;top:14px;left:14px;
display:none;align-items:center;gap:7px;
background:rgba(255,255,255,.82);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border:1px solid rgba(0,0,0,.08);border-radius:30px;
padding:5px 13px;font-size:12px;font-weight:600;color:#1d1d1f;
box-shadow:0 2px 10px rgba(0,0,0,.09);z-index:10;pointer-events:none;
}
#badge.show{display:flex;}
#bdot{width:7px;height:7px;border-radius:50%;background:var(–green);animation:bl 1.1s infinite;}
#badge.thinking #bdot{background:var(–orange);}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}

/* ── TOP RIGHT ───────────────────────────── */
#topRight{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:10;}
.topBtn{
height:36px;border-radius:30px;
background:rgba(255,255,255,.78);
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
border:1px solid rgba(0,0,0,.09);
display:flex;align-items:center;justify-content:center;
cursor:pointer;font-size:13px;font-weight:600;color:#1d1d1f;
box-shadow:0 2px 8px rgba(0,0,0,.1);
transition:all .18s;padding:0 13px;gap:6px;white-space:nowrap;
}
.topBtn:hover{background:rgba(255,255,255,.96);transform:scale(1.05);}
.topBtn:active{transform:scale(.92);}

/* lang dropdown */
#langMenu{
position:absolute;top:58px;right:14px;
background:rgba(255,255,255,.96);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(0,0,0,.1);border-radius:14px;
box-shadow:0 8px 32px rgba(0,0,0,.14);
overflow:hidden;z-index:30;display:none;min-width:170px;
}
#langMenu.show{display:block;}
.langOpt{padding:10px 16px;font-size:13px;font-weight:500;color:#1d1d1f;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;}
.langOpt:hover{background:rgba(0,113,227,.07);}
.langOpt.active{color:var(–accent);font-weight:700;}

/* ── EMPTY ───────────────────────────────── */
#empty{
width:100%;height:100%;background:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.ei{font-size:52px;opacity:.18;}
.et{font-size:22px;font-weight:700;color:#1d1d1f;letter-spacing:-.6px;}
.es{font-size:15px;color:#6e6e73;text-align:center;max-width:300px;line-height:1.5;}

/* ── FLOATING CONTROLS ───────────────────── */
#controls{
position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
display:flex;align-items:center;gap:12px;z-index:100;
}

/* waveform */
#wave{display:flex;gap:2.5px;align-items:center;height:22px;opacity:0;transition:opacity .3s;}
#wave.on{opacity:1;}
.wb{width:2.5px;border-radius:2px;background:rgba(0,0,0,.22);height:4px;transition:height .09s;}

/* mic */
#mic{
width:68px;height:68px;border-radius:50%;border:none;
background:var(–red);color:#fff;font-size:27px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
box-shadow:0 4px 20px rgba(255,59,48,.4),0 2px 6px rgba(0,0,0,.14);
transition:all .22s cubic-bezier(.34,1.56,.64,1);
position:relative;flex-shrink:0;
}
#mic:hover{transform:scale(1.07);}
#mic:active{transform:scale(.9);}
#mic.on{
background:var(–accent);
box-shadow:0 4px 22px rgba(0,113,227,.44),0 2px 6px rgba(0,0,0,.14);
}
#mic.on::before{content:’’;position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(0,113,227,.22);animation:rip 1.9s ease-out infinite;}
#mic.on::after{content:’’;position:absolute;inset:-20px;border-radius:50%;border:1.5px solid rgba(0,113,227,.1);animation:rip 1.9s ease-out .65s infinite;}
@keyframes rip{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.2)}}

/* input pill */
#inputPill{
display:flex;align-items:center;gap:9px;
background:rgba(255,255,255,.88);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(0,0,0,.1);border-radius:30px;
padding:9px 9px 9px 16px;
box-shadow:0 4px 20px rgba(0,0,0,.12);
min-width:200px;
}
#manIn{flex:1;border:none;outline:none;background:transparent;font-family:var(–font);font-size:14px;font-weight:500;color:#1d1d1f;min-width:0;}
#manIn::placeholder{color:#aeaeb2;}
#sendBtn{width:34px;height:34px;border-radius:50%;background:var(–accent);color:#fff;border:none;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;}
#sendBtn:hover{background:#0077ed;transform:scale(1.08);}
#sendBtn:active{transform:scale(.88);}

/* fullscreen */
body.fs{padding:0;background:#000;}
body.fs #slideWrap{max-width:100%;width:100vw;height:100dvh;aspect-ratio:unset;border-radius:0;border:none;}

@media(max-width:560px){
body{padding:10px 10px 94px;}
#mic{width:58px;height:58px;font-size:23px;}
#inputPill{min-width:140px;padding:8px 8px 8px 13px;}
#manIn{font-size:13px;}
}
</style>

</head>
<body>

<div id="slideWrap">
  <div id="slide">
    <div id="empty">
      <div class="ei">🎤</div>
      <div class="et">Premi e parla</div>
      <div class="es">Parla liberamente — una slide sensata appare ogni volta che finisci un concetto</div>
    </div>
  </div>

  <!-- transcript bar at bottom of slide -->

  <div id="transcriptBar">
    <div id="transcriptText">
      <span id="confirmedSpan"></span><span id="interimSpan"></span>
    </div>
  </div>

  <!-- thinking progress bar -->

  <div id="thinkBar"></div>

  <!-- status badge -->

  <div id="badge"><div id="bdot"></div><span id="blabel">In ascolto</span></div>

  <!-- top right: lang + fs -->

  <div id="topRight">
    <div class="topBtn" id="langBtn" onclick="toggleLangMenu()">
      <span id="langFlag">🇮🇹</span><span id="langName">IT</span>
    </div>
    <div class="topBtn" onclick="toggleFS()">⛶</div>
  </div>

  <div id="langMenu">
    <div class="langOpt active" onclick="setLang('it-IT','🇮🇹','IT')">🇮🇹 Italiano</div>
    <div class="langOpt" onclick="setLang('en-US','🇺🇸','EN')">🇺🇸 English</div>
    <div class="langOpt" onclick="setLang('es-ES','🇪🇸','ES')">🇪🇸 Español</div>
    <div class="langOpt" onclick="setLang('fr-FR','🇫🇷','FR')">🇫🇷 Français</div>
    <div class="langOpt" onclick="setLang('de-DE','🇩🇪','DE')">🇩🇪 Deutsch</div>
    <div class="langOpt" onclick="setLang('pt-BR','🇧🇷','PT')">🇧🇷 Português</div>
  </div>
</div>

<div id="controls">
  <div id="wave">
    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    <div class="wb"></div><div class="wb"></div>
  </div>
  <button id="mic" onclick="toggleMic()">🎤</button>
  <div id="inputPill">
    <input id="manIn" type="text" placeholder="Scrivi un concetto…"
      onkeydown="if(event.key==='Enter')sendManual()"/>
    <button id="sendBtn" onclick="sendManual()">↑</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   CONFIG
   Using llama-3.1-8b-instant = fastest Groq model
   ~200-400ms response time
══════════════════════════════════════════════ */
const GROQ_KEY   = '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';
const GROQ_MODEL = 'llama-3.1-8b-instant'; // fastest model available

// Silence before generating slide
const SILENCE_MS = 1400;

/* ══════════════════════════════════════════════
   THEMES
══════════════════════════════════════════════ */
const THEMES = [
  {bg:'#ffffff',h1:'#1d1d1f',h2:'#6e6e73',ac:'#0071e3',card:'#f5f5f7',lgt:true},
  {bg:'#1d1d1f',h1:'#f5f5f7',h2:'#a1a1a6',ac:'#2997ff',card:'#2c2c2e',lgt:false},
  {bg:'#001d3d',h1:'#ffffff',h2:'#90c2e7',ac:'#ffd60a',card:'rgba(255,255,255,.08)',lgt:false},
  {bg:'#faf5eb',h1:'#2c2c2c',h2:'#7a6a52',ac:'#d97706',card:'#fff8e7',lgt:true},
  {bg:'#1a2e1a',h1:'#f0faf0',h2:'#86c88a',ac:'#34c759',card:'rgba(255,255,255,.07)',lgt:false},
  {bg:'#2c2c2e',h1:'#f5f5f7',h2:'#98989d',ac:'#ff9f0a',card:'#3a3a3c',lgt:false},
  {bg:'#fff0f3',h1:'#1d1d1f',h2:'#86566e',ac:'#ff2d55',card:'#ffe4ea',lgt:true},
  {bg:'#0a0a0f',h1:'#ffffff',h2:'#8e8e93',ac:'#bf5af2',card:'rgba(255,255,255,.06)',lgt:false},
];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let listening      = false;
let recognition    = null;
let currentLang    = 'it-IT';
let themeIdx       = 0;
let confirmed      = '';   // final recognised text
let interim        = '';   // partial (shown in transcript bar)
let silTimer       = null;
let aiAbort        = null;
let aiRunning      = false;
let lastSentText   = '';   // avoid duplicate calls

/* ══════════════════════════════════════════════
   WAVEFORM
══════════════════════════════════════════════ */
setInterval(() => {
  if (!listening) return;
  document.querySelectorAll('.wb').forEach(b =>
    b.style.height = (3 + Math.random() * 14) + 'px');
}, 90);

/* ══════════════════════════════════════════════
   TRANSCRIPT BAR — shows what mic hears live
   This is the ONLY live element. Not the slide.
══════════════════════════════════════════════ */
function updateTranscript() {
  const bar = document.getElementById('transcriptBar');
  const conf = document.getElementById('confirmedSpan');
  const int  = document.getElementById('interimSpan');
  if (!confirmed && !interim) {
    bar.classList.remove('show');
    return;
  }
  // Show last ~120 chars of confirmed
  const confText = confirmed.slice(-120);
  conf.textContent = confText + (confText && interim ? ' ' : '');
  int.textContent  = interim;
  bar.classList.add('show');
}

/* ══════════════════════════════════════════════
   SPEECH RECOGNITION
══════════════════════════════════════════════ */
function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang           = currentLang;
  r.continuous     = true;
  r.interimResults = true; // for transcript bar only

  r.onresult = ev => {
    let newFinal = '';
    interim = '';

    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) {
        newFinal += ev.results[i][0].transcript;
      } else {
        interim += ev.results[i][0].transcript;
      }
    }

    if (newFinal) {
      confirmed += (confirmed ? ' ' : '') + newFinal.trim();
      // Keep buffer at ~300 chars max
      if (confirmed.length > 300) confirmed = confirmed.slice(-300);
    }

    updateTranscript();

    // Reset silence timer on every new speech
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      const text = confirmed.trim();
      interim = '';
      confirmed = '';
      updateTranscript();
      if (text.length > 6 && text !== lastSentText) {
        lastSentText = text;
        callAI(text);
      }
    }, SILENCE_MS);
  };

  r.onerror = ev => {
    // Ignore no-speech errors (common), only stop on permission denied
    if (ev.error === 'not-allowed') stopListening();
  };

  r.onend = () => {
    if (listening) setTimeout(() => { try { recognition.start(); } catch(_){} }, 80);
  };

  return r;
}

/* ══════════════════════════════════════════════
   AI SLIDE GENERATION
   Fast model + concise prompt = ~300ms
══════════════════════════════════════════════ */
async function callAI(text) {
  // Cancel any pending request
  if (aiAbort) { aiAbort.abort(); aiAbort = null; }
  aiRunning = true;
  aiAbort   = new AbortController();

  // Show thinking state
  setThinking(true);

  const sys = `Genera una slide visiva professionale basata su ciò che l'utente ha detto.
Rispondi SOLO con JSON valido. Zero markdown. Zero spiegazioni.

Scegli il layout più adatto:
- "tagline"  → titolo grande + sottotitolo breve (concetti, intro, affermazioni)
- "bullets"  → titolo + 3-4 punti chiave (liste, processi, vantaggi)
- "metrics"  → titolo + 2-3 numeri grandi con etichetta (statistiche, dati, KPI)
- "steps"    → titolo + 3-4 passi numerati (come fare, procedure, fasi)
- "quote"    → citazione impattante + autore (frasi, principi, idee)
- "twocol"   → titolo + colonna sinistra / colonna destra (confronti, pro/contro)

JSON schema:
{
  "layout": "tagline|bullets|metrics|steps|quote|twocol",
  "tag": "2-3 PAROLE CHIAVE",
  "title": "Titolo breve e d'impatto, max 6 parole",
  "subtitle": "Frase descrittiva, max 12 parole (solo per tagline)",
  "items": ["Punto 1 chiaro","Punto 2 chiaro","Punto 3 chiaro"],
  "metrics": [{"value":"95%","label":"Soddisfazione"},{"value":"3×","label":"Crescita"}],
  "quote": "La citazione esatta",
  "author": "Nome Autore",
  "left": ["punto sx 1","punto sx 2"],
  "right": ["punto dx 1","punto dx 2"],
  "leftTitle": "Pro",
  "rightTitle": "Contro"
}

REGOLE IMPORTANTI:
- Il contenuto DEVE essere sensato rispetto a ciò che l'utente ha detto
- Titoli brevi e d'impatto, NON frasi lunghe
- Punti elenco: max 8-10 parole ciascuno
- Se menzioni numeri nel testo, usa layout "metrics"
- Rispondi nella stessa lingua dell'utente`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      signal: aiAbort.signal,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+GROQ_KEY },
      body: JSON.stringify({
        model: GROQ_MODEL,
        max_tokens: 350,
        temperature: 0.4, // lower = more consistent, faster
        messages: [
          { role:'system', content: sys },
          { role:'user',   content: text }
        ]
      })
    });

    const data = await res.json();
    const raw  = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g,'').trim();

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch {
      // Fallback: extract JSON from response
      const match = raw.match(/\{[\s\S]*\}/);
      try { parsed = JSON.parse(match?.[0] || '{}'); }
      catch { parsed = { layout:'tagline', tag:'SLIDE', title: text.split(' ').slice(0,5).join(' '), subtitle: text.slice(0,60) }; }
    }

    renderSlide(parsed);

  } catch(err) {
    if (err.name !== 'AbortError') {
      setThinking(false);
    }
  }

  aiRunning = false;
  aiAbort   = null;
}

/* ══════════════════════════════════════════════
   RENDER SLIDE
══════════════════════════════════════════════ */
function renderSlide(d) {
  const t = THEMES[themeIdx % THEMES.length];
  themeIdx++;

  const html = buildLayout(d, t);
  const el   = document.getElementById('slide');

  el.classList.add('out');
  setTimeout(() => {
    el.innerHTML = html;
    el.classList.remove('out');
    setThinking(false);
  }, 200);
}

function setThinking(on) {
  const wrap  = document.getElementById('slideWrap');
  const bar   = document.getElementById('thinkBar');
  const badge = document.getElementById('badge');
  if (on) {
    wrap.classList.add('thinking');
    bar.classList.add('show');
    badge.className = 'show thinking';
    document.getElementById('blabel').textContent = 'Elaboro…';
  } else {
    wrap.classList.remove('thinking');
    bar.classList.remove('show');
    if (listening) {
      badge.className = 'show';
      document.getElementById('blabel').textContent = 'In ascolto';
    } else {
      badge.className = '';
    }
  }
}

/* ══════════════════════════════════════════════
   LAYOUT BUILDERS  — clean, readable slides
══════════════════════════════════════════════ */
function buildLayout(d, t) {
  switch(d.layout) {
    case 'bullets':  return lBullets(d,t);
    case 'metrics':  return lMetrics(d,t);
    case 'steps':    return lSteps(d,t);
    case 'quote':    return lQuote(d,t);
    case 'twocol':   return lTwoCol(d,t);
    default:         return lTagline(d,t);
  }
}

// helpers
const x = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dot  = t => `<div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,${t.ac}00,${t.ac},${t.ac}00);"></div>`;
const blob = t => `<div style="position:absolute;top:-20%;right:-12%;width:45%;aspect-ratio:1;border-radius:50%;background:${t.ac}10;filter:blur(70px);pointer-events:none;"></div><div style="position:absolute;bottom:-18%;left:-10%;width:35%;aspect-ratio:1;border-radius:50%;background:${t.ac}0a;filter:blur(55px);pointer-events:none;"></div>`;
const gridBg = t => `background-image:radial-gradient(${t.lgt?'rgba(0,0,0,.028)':'rgba(255,255,255,.02)'} 1px,transparent 1px);background-size:26px 26px;`;
const pill = (d,t) => `<div style="display:inline-flex;align-items:center;background:${t.ac}18;border:1px solid ${t.ac}26;border-radius:20px;padding:5px 14px;margin-bottom:4%;"><span style="font-size:9px;font-weight:700;letter-spacing:1.8px;color:${t.ac};text-transform:uppercase;">${x(d.tag||'SLIDE')}</span></div>`;

// 1. TAGLINE
function lTagline(d,t){
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9% 12%;position:relative;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;text-align:center;">
  ${blob(t)}
  <div style="z-index:1;display:flex;flex-direction:column;align-items:center;">
    ${pill(d,t)}
    <h1 style="font-size:clamp(28px,5.5vw,66px);font-weight:800;color:${t.h1};line-height:1.04;letter-spacing:-2.5px;margin-bottom:${d.subtitle?'3%':'0'};max-width:860px;">${x(d.title)}</h1>
    ${d.subtitle?`<p style="font-size:clamp(14px,1.9vw,22px);color:${t.h2};line-height:1.5;max-width:600px;font-weight:400;">${x(d.subtitle)}</p>`:''}
  </div>
  ${dot(t)}
</div>`;}

// 2. BULLETS
function lBullets(d,t){
  const items = (d.items||[]).slice(0,4);
  const sep   = t.lgt ? 'rgba(0,0,0,.065)' : 'rgba(255,255,255,.065)';
  const rows  = items.map((b,i) => `
  <div style="display:flex;align-items:flex-start;gap:3.5%;padding:2.8% 0;${i<items.length-1?`border-bottom:1px solid ${sep};`:''}">
    <div style="min-width:clamp(24px,3.2vw,36px);height:clamp(24px,3.2vw,36px);border-radius:9px;background:${t.ac}18;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.4vw,15px);font-weight:800;color:${t.ac};flex-shrink:0;margin-top:1px;">${i+1}</div>
    <span style="font-size:clamp(13px,1.7vw,20px);color:${t.h1};line-height:1.45;font-weight:450;padding-top:1px;opacity:.92;">${x(b)}</span>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative;">
  <div style="padding:5.5% 7% 3.5%;border-bottom:1px solid ${sep};flex-shrink:0;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'PUNTI CHIAVE')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;line-height:1.1;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;padding:0 7%;display:flex;flex-direction:column;justify-content:center;">${rows}</div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,${t.ac},${t.ac}00);"></div>
  ${dot(t)}
</div>`;}

// 3. METRICS
function lMetrics(d,t){
  const mets  = (d.metrics||[]).slice(0,3);
  const sep   = t.lgt ? 'rgba(0,0,0,.065)' : 'rgba(255,255,255,.065)';
  const cards = mets.map(m=>`
  <div style="flex:1;min-width:0;background:${t.card};border-radius:clamp(14px,2.2vw,24px);padding:6% 4%;text-align:center;border:1px solid ${sep};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;">
    <div style="font-size:clamp(34px,7vw,78px);font-weight:900;color:${t.ac};letter-spacing:-3px;line-height:1;">${x(m.value)}</div>
    <div style="font-size:clamp(9px,1.1vw,13px);font-weight:600;color:${t.h2};letter-spacing:1px;text-transform:uppercase;">${x(m.label)}</div>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  ${blob(t)}
  <div style="margin-bottom:5%;position:relative;z-index:1;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'DATI')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;align-items:stretch;gap:3.5%;position:relative;z-index:1;">${cards}</div>
  ${dot(t)}
</div>`;}

// 4. STEPS
function lSteps(d,t){
  const items = (d.items||[]).slice(0,4);
  const cols  = items.map((s,i) => `
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:12%;position:relative;">
    ${i<items.length-1?`<div style="position:absolute;top:11%;left:55%;width:90%;height:2px;background:linear-gradient(90deg,${t.ac}50,${t.ac}10);z-index:0;"></div>`:''}
    <div style="width:clamp(34px,4.8vw,56px);height:clamp(34px,4.8vw,56px);border-radius:50%;background:${t.ac};display:flex;align-items:center;justify-content:center;font-size:clamp(14px,1.9vw,22px);font-weight:800;color:#fff;z-index:1;flex-shrink:0;box-shadow:0 4px 16px ${t.ac}44;">${i+1}</div>
    <div style="font-size:clamp(11px,1.3vw,15px);color:${t.h1};line-height:1.4;font-weight:500;text-align:center;opacity:.9;">${x(s)}</div>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  <div style="margin-bottom:7%;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'STEPS')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:0;">${cols}</div>
  ${dot(t)}
</div>`;}

// 5. QUOTE
function lQuote(d,t){
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10% 14%;position:relative;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;text-align:center;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,${t.ac}0d 0%,transparent 68%);pointer-events:none;"></div>
  <div style="font-size:clamp(56px,12vw,120px);line-height:.7;color:${t.ac};font-weight:800;opacity:.15;margin-bottom:3%;z-index:1;font-family:Georgia,serif;">"</div>
  <p style="font-size:clamp(17px,2.9vw,34px);font-weight:500;color:${t.h1};line-height:1.48;max-width:720px;font-style:italic;z-index:1;letter-spacing:-.3px;">${x(d.quote||d.title)}</p>
  <div style="width:40px;height:2px;background:${t.ac};border-radius:1px;margin:5% auto;z-index:1;"></div>
  ${d.author?`<div style="font-size:clamp(12px,1.4vw,16px);font-weight:600;color:${t.h2};z-index:1;">— ${x(d.author)}</div>`:''}
  ${dot(t)}
</div>`;}

// 6. TWO COLUMN (confronto)
function lTwoCol(d,t){
  const L    = (d.left||[]).slice(0,4);
  const R    = (d.right||[]).slice(0,4);
  const sep  = t.lgt ? 'rgba(0,0,0,.065)' : 'rgba(255,255,255,.065)';
  const col  = (items, color, title) => `
  <div style="flex:1;background:${color}12;border-radius:16px;padding:5% 5%;border:1px solid ${color}22;">
    <div style="font-size:clamp(11px,1.3vw,15px);font-weight:700;color:${color};margin-bottom:4%;letter-spacing:-.2px;">${x(title)}</div>
    ${items.map(i=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:3%;"><span style="color:${color};font-weight:700;flex-shrink:0;margin-top:1px;">•</span><span style="font-size:clamp(11px,1.3vw,15px);color:${t.h1};line-height:1.4;opacity:.9;">${x(i)}</span></div>`).join('')}
  </div>`;
  return `<div style="width:100%;height:100%;background:${t.bg};${gridBg(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  <div style="margin-bottom:4%;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'CONFRONTO')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;gap:3.5%;">
    ${col(L, t.ac, d.leftTitle||'Vantaggi')}
    ${col(R, '#ff3b30', d.rightTitle||'Svantaggi')}
  </div>
  ${dot(t)}
</div>`;}

/* ══════════════════════════════════════════════
   MIC CONTROLS
══════════════════════════════════════════════ */
function toggleMic() { listening ? stopListening() : startListening(); }

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Usa Chrome o Safari per il microfono.'); return; }
  listening = true;
  if (recognition) { try { recognition.abort(); } catch(_){} }
  recognition = buildRecognition();
  try { recognition.start(); } catch(_){}

  document.getElementById('mic').className   = 'on';
  document.getElementById('mic').textContent  = '⏹';
  document.getElementById('wave').className   = 'on';
  document.getElementById('badge').className  = 'show';
  document.getElementById('blabel').textContent = 'In ascolto';
}

function stopListening() {
  listening = false;
  clearTimeout(silTimer);
  if (recognition) { try { recognition.abort(); } catch(_){} }

  // Flush remaining text
  const text = confirmed.trim();
  confirmed = ''; interim = '';
  updateTranscript();

  document.getElementById('mic').className   = '';
  document.getElementById('mic').textContent  = '🎤';
  document.getElementById('wave').className   = '';
  document.querySelectorAll('.wb').forEach(b => b.style.height = '4px');
  document.getElementById('badge').className  = '';
  document.getElementById('transcriptBar').classList.remove('show');

  if (text.length > 6 && text !== lastSentText) {
    lastSentText = text;
    callAI(text);
  }
}

/* ══════════════════════════════════════════════
   MANUAL INPUT
══════════════════════════════════════════════ */
function sendManual() {
  const inp  = document.getElementById('manIn');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  lastSentText = text;
  callAI(text);
}

/* ══════════════════════════════════════════════
   LANGUAGE
══════════════════════════════════════════════ */
function toggleLangMenu() { document.getElementById('langMenu').classList.toggle('show'); }
function setLang(code, flag, name) {
  currentLang = code;
  document.getElementById('langFlag').textContent = flag;
  document.getElementById('langName').textContent = name;
  document.getElementById('langMenu').classList.remove('show');
  document.querySelectorAll('.langOpt').forEach(el =>
    el.classList.toggle('active', el.textContent.trim().startsWith(flag)));
  if (listening) {
    if (recognition) { try { recognition.abort(); } catch(_){} }
    recognition = buildRecognition();
    setTimeout(() => { try { recognition.start(); } catch(_){} }, 150);
  }
}
document.addEventListener('click', e => {
  if (!e.target.closest('#langBtn') && !e.target.closest('#langMenu'))
    document.getElementById('langMenu').classList.remove('show');
});

/* ══════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════ */
function toggleFS() {
  const el = document.getElementById('slideWrap');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    document.body.classList.remove('fs');
  } else {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    document.body.classList.add('fs');
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('fs');
});
</script>
