<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VoiceSlide</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f5f5f7;
    --border: rgba(0,0,0,0.08);
    --text: #1d1d1f;
    --text2: #6e6e73;
    --text3: #aeaeb2;
    --accent: #0071e3;
    --green: #34c759;
    --red: #ff3b30;
    --slide-bg: #1d1d1f;
    --r: 18px; --rs: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,'Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.12); border-radius:3px; }

@keyframes slideUp { from{opacity:0;transform:translateY(20px) scale(0.98)} to{opacity:1;transform:none} }
@keyframes popIn { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }
@keyframes itemIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:none} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes wave { 0%,100%{transform:scaleY(0.25)} 50%{transform:scaleY(1)} }
@keyframes ripple { 0%{box-shadow:0 0 0 0 rgba(0,113,227,0.25)} 70%{box-shadow:0 0 0 18px rgba(0,113,227,0)} 100%{box-shadow:0 0 0 0 rgba(0,113,227,0)} }
@keyframes rippleRed { 0%{box-shadow:0 0 0 0 rgba(255,59,48,0.25)} 70%{box-shadow:0 0 0 18px rgba(255,59,48,0)} 100%{box-shadow:0 0 0 0 rgba(255,59,48,0)} }

#app { height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* HEADER */
header {
height:52px; flex-shrink:0;
background:rgba(245,245,247,0.85); backdrop-filter:blur(20px);
border-bottom:1px solid var(–border);
display:flex; align-items:center; justify-content:space-between; padding:0 24px;
position:relative; z-index:10;
}
.hd-left { display:flex; align-items:center; gap:9px; }
.app-ico { width:28px; height:28px; border-radius:7px; background:linear-gradient(145deg,#0a84ff,#0055b3); display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 8px rgba(0,113,227,0.28); }
.app-nm { font-size:15px; font-weight:600; letter-spacing:-0.3px; }
.app-badge { font-size:10px; color:var(–accent); background:rgba(0,113,227,0.08); padding:2px 8px; border-radius:20px; font-weight:500; }
#present-btn { display:none; padding:6px 16px; border-radius:20px; background:var(–accent); color:#fff; border:none; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; letter-spacing:-0.2px; transition:background 0.15s,transform 0.1s; }
#present-btn:hover { background:#005bbf; } #present-btn:active { transform:scale(0.96); }

/* LAYOUT */
.main { flex:1; display:flex; overflow:hidden; }

/* LEFT */
.left { width:272px; flex-shrink:0; background:var(–surface); border-right:1px solid var(–border); display:flex; flex-direction:column; overflow:hidden; }

.mic-sec { padding:28px 20px 22px; display:flex; flex-direction:column; align-items:center; gap:16px; border-bottom:1px solid var(–border); }
#mic-btn {
width:72px; height:72px; border-radius:50%; border:none; cursor:pointer; font-size:26px; outline:none;
background:rgba(0,113,227,0.07); transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
display:flex; align-items:center; justify-content:center;
animation:ripple 2.5s infinite;
}
#mic-btn.listening { background:rgba(255,59,48,0.09); animation:rippleRed 1.8s infinite; }
#mic-btn:hover { transform:scale(1.06); } #mic-btn:active { transform:scale(0.93); }
#mic-btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; animation:none; }

.st-row { display:flex; flex-direction:column; align-items:center; gap:8px; }
#st-txt { font-size:13px; font-weight:500; color:var(–text2); transition:color 0.3s; }

.wv-wrap { display:flex; align-items:center; gap:2.5px; height:18px; }
.wv-bar { width:2.5px; border-radius:2px; background:var(–text3); height:4px; transition:background 0.3s; }
.wv-wrap.on .wv-bar { background:var(–accent); animation:wave 0.7s ease-in-out infinite alternate; }

#hint { font-size:12px; color:var(–text3); text-align:center; line-height:1.55; padding:0 6px; }
#err { display:none; font-size:12px; color:var(–red); text-align:center; background:rgba(255,59,48,0.06); border:1px solid rgba(255,59,48,0.15); padding:10px; border-radius:var(–rs); line-height:1.45; }

.tr-sec { flex:1; overflow-y:auto; padding:14px 18px; display:none; flex-direction:column; gap:8px; }
.sec-lbl { font-size:10.5px; font-weight:600; color:var(–text3); text-transform:uppercase; letter-spacing:0.6px; }
#tr-wrap { font-size:12.5px; line-height:1.65; color:var(–text2); background:var(–surface2); border-radius:var(–rs); padding:11px 13px; max-height:130px; overflow-y:auto; }
#live-sp { color:var(–accent); }

.hist-sec { padding:0 12px 14px; display:none; flex-direction:column; gap:7px; }
.hist-sec .sec-lbl { padding:0 6px; }
#hist-list { display:flex; flex-direction:column; gap:3px; max-height:190px; overflow-y:auto; }
.hi { display:flex; align-items:center; justify-content:space-between; padding:9px 11px; border-radius:var(–rs); cursor:pointer; border:1.5px solid transparent; transition:all 0.15s; text-align:left; background:transparent; width:100%; font-family:inherit; }
.hi:hover { background:var(–surface2); }
.hi.on { background:rgba(0,113,227,0.06); border-color:rgba(0,113,227,0.2); }
.hi-t { font-size:12.5px; font-weight:500; color:var(–text); max-width:148px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hi-l { font-size:10px; color:var(–accent); background:rgba(0,113,227,0.08); padding:2px 7px; border-radius:10px; font-weight:500; }

/* RIGHT */
.right { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; gap:18px; }

#sc {
width:100%; max-width:780px; aspect-ratio:16/9;
background:var(–slide-bg); border-radius:20px;
box-shadow:0 8px 40px rgba(0,0,0,0.13), 0 0 0 1px rgba(0,0,0,0.05);
overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;
}
#si { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:40px; }

#emp { display:flex; flex-direction:column; align-items:center; gap:12px; opacity:0.4; }
.emp-ic { width:60px; height:60px; border-radius:14px; border:1.5px dashed rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:22px; color:rgba(255,255,255,0.3); }
.emp-tx { font-size:12.5px; color:rgba(255,255,255,0.3); text-align:center; line-height:1.5; }

#gen {
display:none; position:absolute; bottom:14px; right:14px; align-items:center; gap:6px;
background:rgba(255,255,255,0.07); backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1); padding:5px 11px; border-radius:20px;
}
.sp { width:12px; height:12px; border:1.5px solid rgba(255,255,255,0.18); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
#gen span { font-size:11px; color:rgba(255,255,255,0.55); }

.ltags { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
.lt { font-size:11px; color:var(–text3); background:var(–surface); border:1px solid var(–border); padding:3px 9px; border-radius:20px; }

/* SLIDE INNER STYLES */
.sc-wrap { display:flex; flex-direction:column; align-items:center; gap:13px; width:100%; animation:slideUp 0.45s cubic-bezier(0.16,1,0.3,1); }
.s-title { font-family:‘Playfair Display’,serif; font-weight:700; color:#f5f5f7; text-align:center; line-height:1.2; letter-spacing:-0.025em; }
.s-title.lg { font-size:clamp(1.9rem,4.5vw,3.1rem); }
.s-title.md { font-size:clamp(1.2rem,2.8vw,2rem); }
.s-sub { font-size:clamp(0.78rem,1.4vw,0.93rem); color:rgba(245,245,247,0.45); text-align:center; font-weight:400; }

.s-bullets { list-style:none; display:flex; flex-direction:column; gap:8px; max-width:480px; width:100%; text-align:left; }
.s-bullets li { display:flex; align-items:flex-start; gap:10px; color:rgba(245,245,247,0.82); font-size:clamp(0.76rem,1.35vw,0.9rem); line-height:1.45; animation:itemIn 0.4s both; }
.bdot { width:5px; height:5px; border-radius:50%; background:#0a84ff; flex-shrink:0; margin-top:5px; }

.s-metric { display:flex; flex-direction:column; align-items:center; gap:6px; }
.s-mval { font-family:‘Playfair Display’,serif; font-size:clamp(3rem,8vw,5.5rem); font-weight:800; color:#fff; letter-spacing:-0.04em; line-height:1; animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
.s-mlbl { font-size:clamp(0.8rem,1.5vw,1rem); color:rgba(245,245,247,0.45); }
.s-mchg { font-size:0.8rem; color:#32d74b; background:rgba(50,215,75,0.1); padding:2px 10px; border-radius:20px; }

.s-steps { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:560px; }
.s-step { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1 1 100px; animation:itemIn 0.4s both; }
.s-snum { width:32px; height:32px; border-radius:50%; background:rgba(10,132,255,0.15); border:1.5px solid rgba(10,132,255,0.3); color:#0a84ff; font-size:0.84rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
.s-stxt { font-size:0.8rem; color:rgba(245,245,247,0.72); text-align:center; line-height:1.4; }

.s-quote { max-width:500px; display:flex; flex-direction:column; gap:12px; align-items:center; }
.s-qbody { font-family:‘Playfair Display’,serif; font-size:clamp(0.95rem,2vw,1.2rem); color:rgba(245,245,247,0.9); font-style:italic; text-align:center; line-height:1.65; }
.s-qmark { color:#0a84ff; font-size:2.8rem; line-height:0; vertical-align:-0.35em; margin-right:3px; font-style:normal; }
.s-qauth { font-size:0.8rem; color:rgba(245,245,247,0.3); }

.s-team { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
.s-tc { display:flex; flex-direction:column; align-items:center; gap:7px; animation:itemIn 0.4s both; }
.s-tav { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:700; color:#fff; border:2px solid rgba(255,255,255,0.08); }
.s-tnm { font-size:0.87rem; color:#f5f5f7; font-weight:600; }
.s-trl { font-size:0.74rem; color:rgba(245,245,247,0.35); }

.s-tl { display:flex; flex-direction:column; gap:10px; max-width:440px; text-align:left; }
.s-tlrow { display:flex; gap:14px; align-items:flex-start; animation:itemIn 0.4s both; }
.s-tlyr { font-size:0.78rem; font-weight:600; color:#0a84ff; min-width:38px; padding-top:2px; }
.s-tlev { flex:1; border-left:1px solid rgba(255,255,255,0.07); padding-left:12px; font-size:0.87rem; color:rgba(245,245,247,0.78); line-height:1.4; }

.s-comp { display:flex; gap:12px; max-width:540px; }
.s-cc { flex:1; border-radius:14px; padding:14px; animation:itemIn 0.4s both; }
.s-cc.l { background:rgba(10,132,255,0.08); border:1px solid rgba(10,132,255,0.18); }
.s-cc.r { background:rgba(50,215,75,0.06); border:1px solid rgba(50,215,75,0.18); }
.s-clbl { font-size:0.82rem; font-weight:700; margin-bottom:8px; }
.s-cc.l .s-clbl { color:#0a84ff; } .s-cc.r .s-clbl { color:#32d74b; }
.s-cpt { font-size:0.77rem; color:rgba(245,245,247,0.65); margin:3px 0; }

/* PRESENT MODE */
#pm { display:none; position:fixed; inset:0; background:#000; z-index:200; flex-direction:column; }
#pm.on { display:flex; }
#pm-stage { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
#pm-canvas {
width:min(920px,90vw); aspect-ratio:16/9;
background:var(–slide-bg); border-radius:20px;
box-shadow:0 40px 120px rgba(0,0,0,0.8);
overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;
}
#pm-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:50px; }
#pm-bar { height:54px; background:rgba(18,18,18,0.92); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:space-between; padding:0 26px; flex-shrink:0; }
.pm-wv .wv-bar { background:rgba(255,255,255,0.18); }
.pm-wv.on .wv-bar { background:#32d74b; animation:wave 0.7s ease-in-out infinite alternate; }
#pm-st { font-size:12px; color:rgba(255,255,255,0.3); }
.pm-btns { display:flex; gap:7px; }
.pmb { padding:6px 14px; border-radius:20px; border:none; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; transition:opacity 0.15s; }
.pmb:active { opacity:0.7; }
.pmb-go { background:rgba(50,215,75,0.13); color:#32d74b; border:1px solid rgba(50,215,75,0.25); }
.pmb-stop { background:rgba(255,59,48,0.13); color:#ff3b30; border:1px solid rgba(255,59,48,0.25); }
.pmb-back { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.1); }
#pm-cnt { font-size:12px; color:rgba(255,255,255,0.18); }

@media(max-width:620px){
.left{width:100%;max-height:42vh;border-right:none;border-bottom:1px solid var(–border);}
.main{flex-direction:column;}
.right{padding:14px;}
#sc{border-radius:14px;}
}
</style>

</head>

<script>
const KEY = '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';

const SYS = `You are a real-time presentation AI. Based on what the speaker says, generate ONE slide as a raw JSON object.
NO markdown, NO backticks, NO explanation — only valid JSON.

{
  "layout": "tagline"|"bullets"|"metric"|"steps"|"quote"|"team"|"timeline"|"comparison",
  "title": "...",
  "subtitle": "..." or null,
  "content": ...
}

Content rules:
- tagline: null
- bullets: ["item","item"] (2-5)
- metric: {"value":"50M","label":"users","change":"+10%"}
- steps: ["step1","step2"] (2-4)
- quote: {"text":"...","author":"Name"}
- team: [{"name":"Alice","role":"CEO"},...] (2-4)
- timeline: [{"year":"2020","event":"Founded"},...] (3-5)
- comparison: {"left":{"label":"A","points":["x","y"]},"right":{"label":"B","points":["x","y"]}}

Mapping: numbers→metric, list→bullets, process→steps, people→team, history→timeline, compare→comparison, inspiring→quote, open/close→tagline.`;

let listening=false, slides=[], curIdx=-1, fullTr='', buf='', lastGen='', timer=null, rec=null;

const $=id=>document.getElementById(id);
const micBtn=$('mic-btn'), micIc=$('mic-ic'), stTxt=$('st-txt');
const wv=$('wv'), pmWv=$('pm-wv');
const errEl=$('err'), hintEl=$('hint');
const trSec=$('tr-sec'), trTxt=$('tr-txt'), liveSp=$('live-sp');
const histSec=$('hist-sec'), histList=$('hist-list'), scCnt=$('sc-cnt');
const si=$('si'), genBadge=$('gen'), presentBtn=$('present-btn');
const pm=$('pm'), pmInner=$('pm-inner'), pmMic=$('pm-mic'), pmBack=$('pm-back');
const pmSt=$('pm-st'), pmCnt=$('pm-cnt');

const AVCOLORS=['#0071e3','#34c759','#ff9500','#ff2d55','#af52de','#5856d6'];

function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ errEl.textContent='⚠️ Usa Chrome su desktop per il riconoscimento vocale.'; errEl.style.display='block'; micBtn.disabled=true; return; }
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang='it-IT';
  rec.onresult=ev=>{
    let fin='',int='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      ev.results[i].isFinal?(fin+=t):(int+=t);
    }
    if(fin){ buf+=' '+fin; fullTr+=' '+fin; trTxt.textContent=fullTr.trim(); trSec.style.display='flex'; }
    liveSp.textContent=int?' '+int:'';
    clearTimeout(timer);
    if(buf.trim().split(/\s+/).filter(Boolean).length>=5){
      timer=setTimeout(()=>{ const c=buf.trim(); if(c&&c!==lastGen){genSlide(c);lastGen=c;buf='';} },2300);
    }
  };
  rec.onerror=ev=>{ if(ev.error!=='no-speech') setSt('Errore: '+ev.error,'#ff3b30'); };
  rec.onend=()=>{ if(listening) rec.start(); };
}

function setSt(t,c='#6e6e73'){ stTxt.textContent=t; stTxt.style.color=c; pmSt.textContent=t; pmSt.style.color=c==='#6e6e73'?'rgba(255,255,255,0.3)':c; }
function setWave(on){ wv.className=on?'wv-wrap on':'wv-wrap'; pmWv.className=on?'wv-wrap pm-wv on':'wv-wrap pm-wv'; }

function toggleMic(){
  if(!rec) return;
  if(listening){
    rec.stop(); listening=false;
    micBtn.className=''; micIc.textContent='🎤';
    pmMic.className='pmb pmb-go'; pmMic.textContent='🎤\u00a0Parla';
    setWave(false); setSt('Tocca per iniziare'); liveSp.textContent=''; hintEl.style.display='block';
  } else {
    fullTr='';buf='';lastGen='';slides=[];curIdx=-1;
    trTxt.textContent=''; histList.innerHTML=''; histSec.style.display='none';
    scCnt.textContent='0'; pmCnt.textContent='0 slide'; presentBtn.style.display='none';
    showEmp(); errEl.style.display='none';
    rec.start(); listening=true;
    micBtn.className='listening'; micIc.textContent='⏹';
    pmMic.className='pmb pmb-stop'; pmMic.textContent='⏹\u00a0Stop';
    setWave(true); setSt('In ascolto…','#34c759'); hintEl.style.display='none';
  }
}
micBtn.addEventListener('click',toggleMic);
pmMic.addEventListener('click',toggleMic);

async function genSlide(text){
  genBadge.style.display='flex'; setSt('Generando…','#0071e3');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:800,system:SYS,messages:[{role:'user',content:`Speaker: "${text}"`}]})
    });
    const d=await r.json();
    if(d.error) throw new Error(d.error.type+': '+d.error.message);
    const raw=(d.content||[]).map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    const slide=JSON.parse(raw);
    slide.id=Date.now();
    slides.push(slide); curIdx=slides.length-1;
    renderSlide(slide,si); renderSlide(slide,pmInner);
    addHist(slide,curIdx);
    presentBtn.style.display='block';
    scCnt.textContent=slides.length; pmCnt.textContent=slides.length+' slide';
    setSt('In ascolto…','#34c759');
    errEl.style.display='none';
  } catch(err){
    console.error(err);
    errEl.textContent='⚠️ '+err.message;
    errEl.style.display='block';
    setSt('Errore','#ff3b30');
    setTimeout(()=>{ setSt('In ascolto…','#34c759'); },3000);
  }
  finally { genBadge.style.display='none'; }
}

function renderSlide(slide,container){
  const {layout,title,subtitle,content}=slide;
  const big=layout==='tagline';
  let h=`<div class="sc-wrap">`;
  h+=`<h1 class="s-title ${big?'lg':'md'}">${e(title)}</h1>`;
  if(subtitle) h+=`<p class="s-sub">${e(subtitle)}</p>`;

  if(layout==='bullets'&&Array.isArray(content)){
    h+=`<ul class="s-bullets">`;
    content.forEach((b,i)=>h+=`<li style="animation-delay:${i*.07}s"><span class="bdot"></span>${e(b)}</li>`);
    h+=`</ul>`;
  }
  if(layout==='metric'&&content){
    h+=`<div class="s-metric"><span class="s-mval">${e(content.value||'')}</span><span class="s-mlbl">${e(content.label||'')}</span>${content.change?`<span class="s-mchg">${e(content.change)}</span>`:''}</div>`;
  }
  if(layout==='steps'&&Array.isArray(content)){
    h+=`<div class="s-steps">`;
    content.forEach((s,i)=>h+=`<div class="s-step" style="animation-delay:${i*.09}s"><div class="s-snum">${i+1}</div><span class="s-stxt">${e(s)}</span></div>`);
    h+=`</div>`;
  }
  if(layout==='quote'&&content){
    h+=`<div class="s-quote"><p class="s-qbody"><span class="s-qmark">"</span>${e(content.text||'')}</p>${content.author?`<p class="s-qauth">— ${e(content.author)}</p>`:''}</div>`;
  }
  if(layout==='team'&&Array.isArray(content)){
    h+=`<div class="s-team">`;
    content.forEach((p,i)=>h+=`<div class="s-tc" style="animation-delay:${i*.09}s"><div class="s-tav" style="background:${AVCOLORS[i%AVCOLORS.length]}">${e((p.name||'?')[0])}</div><span class="s-tnm">${e(p.name||'')}</span><span class="s-trl">${e(p.role||'')}</span></div>`);
    h+=`</div>`;
  }
  if(layout==='timeline'&&Array.isArray(content)){
    h+=`<div class="s-tl">`;
    content.forEach((ev,i)=>h+=`<div class="s-tlrow" style="animation-delay:${i*.07}s"><span class="s-tlyr">${e(ev.year||'')}</span><span class="s-tlev">${e(ev.event||'')}</span></div>`);
    h+=`</div>`;
  }
  if(layout==='comparison'&&content){
    h+=`<div class="s-comp">`;
    ['left','right'].forEach((side,i)=>{
      const d=content[side]||{};
      h+=`<div class="s-cc ${side==='left'?'l':'r'}" style="animation-delay:${i*.1}s"><div class="s-clbl">${e(d.label||'')}</div>${(d.points||[]).map(p=>`<p class="s-cpt">• ${e(p)}</p>`).join('')}</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  container.innerHTML=h;
}

function showEmp(){ si.innerHTML=`<div id="emp"><div class="emp-ic">✦</div><p class="emp-tx">Le slide appariranno qui<br>mentre parli</p></div>`; }

function addHist(slide,idx){
  histSec.style.display='flex';
  document.querySelectorAll('.hi').forEach(b=>b.classList.remove('on'));
  const btn=document.createElement('button');
  btn.className='hi on'; btn.dataset.i=idx;
  const t=(slide.title||'').slice(0,25);
  btn.innerHTML=`<span class="hi-t">${e(t)}${(slide.title||'').length>25?'…':''}</span><span class="hi-l">${e(slide.layout)}</span>`;
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.hi').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const s=slides[+btn.dataset.i];
    renderSlide(s,si); renderSlide(s,pmInner);
  });
  histList.appendChild(btn);
  histList.scrollTop=histList.scrollHeight;
}

function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

presentBtn.addEventListener('click',()=>{ pm.classList.add('on'); if(curIdx>=0) renderSlide(slides[curIdx],pmInner); });
pmBack.addEventListener('click',()=>pm.classList.remove('on'));
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') pm.classList.remove('on'); });

initSpeech();
</script>
