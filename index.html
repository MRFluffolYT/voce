<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Slide Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eeeae4;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --accent:#0071e3;
  --red:#ff3b30;
  --green:#34c759;
  --orange:#ff9f0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 22px 108px;}

/* ── SLIDE ───────────────────────────────── */
#slideWrap{
width:100%;max-width:1080px;aspect-ratio:16/9;
border-radius:22px;overflow:hidden;
box-shadow:0 14px 64px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.07);
background:#fff;position:relative;flex-shrink:0;
border:2px solid transparent;transition:border-color .25s,box-shadow .25s;
}
#slideWrap.on{
border-color:rgba(0,113,227,.38);
box-shadow:0 0 0 4px rgba(0,113,227,.08),0 14px 64px rgba(0,0,0,.16);
}
#slideWrap.thinking{
border-color:rgba(255,159,10,.45);
box-shadow:0 0 0 4px rgba(255,159,10,.08),0 14px 64px rgba(0,0,0,.16);
}

#slide{width:100%;height:100%;transition:opacity .2s ease,transform .26s cubic-bezier(.16,1,.3,1);}
#slide.out{opacity:0;transform:scale(.972);}

/* thinking sweep bar */
#thinkBar{position:absolute;bottom:0;left:0;right:0;height:3px;background:transparent;overflow:hidden;display:none;z-index:10;}
#thinkBar.show{display:block;}
#thinkBar::after{content:’’;display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(–orange),transparent);animation:sweep .9s ease-in-out infinite;}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(380%)}}

/* transcript bar — shows what mic hears */
#tBar{
position:absolute;bottom:0;left:0;right:0;padding:12px 20px 14px;
background:linear-gradient(0deg,rgba(0,0,0,.52) 0%,transparent 100%);
font-size:clamp(12px,1.55vw,17px);color:rgba(255,255,255,.92);
font-weight:500;letter-spacing:-.2px;line-height:1.4;
min-height:50px;display:flex;align-items:flex-end;
opacity:0;transition:opacity .25s;z-index:5;pointer-events:none;
}
#tBar.show{opacity:1;}
#tConf{} /* confirmed words */
#tInt{opacity:.5;font-style:italic;} /* interim */

/* badge */
#badge{position:absolute;top:14px;left:14px;display:none;align-items:center;gap:7px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.08);border-radius:30px;padding:5px 13px;font-size:12px;font-weight:600;color:#1d1d1f;box-shadow:0 2px 10px rgba(0,0,0,.09);z-index:10;pointer-events:none;}
#badge.show{display:flex;}
#bdot{width:7px;height:7px;border-radius:50%;background:var(–green);animation:bl 1.1s infinite;}
#badge.thinking #bdot{background:var(–orange);}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}

/* top right */
#topRight{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:10;}
.topBtn{height:36px;border-radius:30px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.09);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:600;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .18s;padding:0 13px;gap:6px;white-space:nowrap;}
.topBtn:hover{background:rgba(255,255,255,.96);transform:scale(1.05);}
.topBtn:active{transform:scale(.92);}
#langMenu{position:absolute;top:58px;right:14px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.1);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.14);overflow:hidden;z-index:30;display:none;min-width:170px;}
#langMenu.show{display:block;}
.langOpt{padding:10px 16px;font-size:13px;font-weight:500;color:#1d1d1f;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;}
.langOpt:hover{background:rgba(0,113,227,.07);}
.langOpt.active{color:var(–accent);font-weight:700;}

/* empty */
#empty{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.ei{font-size:52px;opacity:.18;}
.et{font-size:22px;font-weight:700;color:#1d1d1f;letter-spacing:-.6px;}
.es{font-size:15px;color:#6e6e73;text-align:center;max-width:320px;line-height:1.5;}

/* controls */
#controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:100;}
#wave{display:flex;gap:2.5px;align-items:center;height:22px;opacity:0;transition:opacity .3s;}
#wave.on{opacity:1;}
.wb{width:2.5px;border-radius:2px;background:rgba(0,0,0,.22);height:4px;transition:height .09s;}
#mic{width:68px;height:68px;border-radius:50%;border:none;background:var(–red);color:#fff;font-size:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,59,48,.4),0 2px 6px rgba(0,0,0,.14);transition:all .22s cubic-bezier(.34,1.56,.64,1);position:relative;flex-shrink:0;}
#mic:hover{transform:scale(1.07);}
#mic:active{transform:scale(.9);}
#mic.on{background:var(–accent);box-shadow:0 4px 22px rgba(0,113,227,.44),0 2px 6px rgba(0,0,0,.14);}
#mic.on::before{content:’’;position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(0,113,227,.22);animation:rip 1.9s ease-out infinite;}
#mic.on::after{content:’’;position:absolute;inset:-20px;border-radius:50%;border:1.5px solid rgba(0,113,227,.1);animation:rip 1.9s ease-out .65s infinite;}
@keyframes rip{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.2)}}
#inputPill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.1);border-radius:30px;padding:9px 9px 9px 16px;box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:200px;}
#manIn{flex:1;border:none;outline:none;background:transparent;font-family:var(–font);font-size:14px;font-weight:500;color:#1d1d1f;min-width:0;}
#manIn::placeholder{color:#aeaeb2;}
#sendBtn{width:34px;height:34px;border-radius:50%;background:var(–accent);color:#fff;border:none;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;}
#sendBtn:hover{background:#0077ed;transform:scale(1.08);}
#sendBtn:active{transform:scale(.88);}

body.fs{padding:0;background:#000;}
body.fs #slideWrap{max-width:100%;width:100vw;height:100dvh;aspect-ratio:unset;border-radius:0;border:none;}
@media(max-width:560px){body{padding:10px 10px 94px;}#mic{width:58px;height:58px;font-size:23px;}#inputPill{min-width:140px;padding:8px 8px 8px 13px;}#manIn{font-size:13px;}}
</style>

</head>
<body>

<div id="slideWrap">
  <div id="slide">
    <div id="empty">
      <div class="ei">🎤</div>
      <div class="et">Parla liberamente</div>
      <div class="es">La slide si genera ad ogni frase — continua a parlare senza fermarti</div>
    </div>
  </div>
  <div id="tBar"><span id="tConf"></span><span id="tInt"></span></div>
  <div id="thinkBar"></div>
  <div id="badge"><div id="bdot"></div><span id="blabel">In ascolto</span></div>
  <div id="topRight">
    <div class="topBtn" id="langBtn" onclick="toggleLangMenu()"><span id="langFlag">🇮🇹</span><span id="langName">IT</span></div>
    <div class="topBtn" onclick="toggleFS()">⛶</div>
  </div>
  <div id="langMenu">
    <div class="langOpt active" onclick="setLang('it-IT','🇮🇹','IT')">🇮🇹 Italiano</div>
    <div class="langOpt" onclick="setLang('en-US','🇺🇸','EN')">🇺🇸 English</div>
    <div class="langOpt" onclick="setLang('es-ES','🇪🇸','ES')">🇪🇸 Español</div>
    <div class="langOpt" onclick="setLang('fr-FR','🇫🇷','FR')">🇫🇷 Français</div>
    <div class="langOpt" onclick="setLang('de-DE','🇩🇪','DE')">🇩🇪 Deutsch</div>
    <div class="langOpt" onclick="setLang('pt-BR','🇧🇷','PT')">🇧🇷 Português</div>
  </div>
</div>

<div id="controls">
  <div id="wave"><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div></div>
  <button id="mic" onclick="toggleMic()">🎤</button>
  <div id="inputPill">
    <input id="manIn" type="text" placeholder="Scrivi un concetto…" onkeydown="if(event.key==='Enter')sendManual()"/>
    <button id="sendBtn" onclick="sendManual()">↑</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   CONFIG
   llama-3.1-8b-instant = ~200-400ms on Groq
════════════════════════════════════════ */
const GROQ_KEY   = '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';
const GROQ_MODEL = 'llama-3.1-8b-instant';

// Min words in a final result before triggering a slide
const MIN_WORDS_FOR_SLIDE = 6;

// After this silence → flush whatever is left
const FLUSH_MS = 1200;

/* ════════════════════════════════════════
   THEMES
════════════════════════════════════════ */
const TH = [
  {bg:'#ffffff',h1:'#1d1d1f',h2:'#6e6e73',ac:'#0071e3',card:'#f5f5f7',lgt:true},
  {bg:'#1d1d1f',h1:'#f5f5f7',h2:'#a1a1a6',ac:'#2997ff',card:'#2c2c2e',lgt:false},
  {bg:'#001d3d',h1:'#ffffff',h2:'#90c2e7',ac:'#ffd60a',card:'rgba(255,255,255,.08)',lgt:false},
  {bg:'#faf5eb',h1:'#2c2c2c',h2:'#7a6a52',ac:'#d97706',card:'#fff8e7',lgt:true},
  {bg:'#1a2e1a',h1:'#f0faf0',h2:'#86c88a',ac:'#34c759',card:'rgba(255,255,255,.07)',lgt:false},
  {bg:'#2c2c2e',h1:'#f5f5f7',h2:'#98989d',ac:'#ff9f0a',card:'#3a3a3c',lgt:false},
  {bg:'#fff0f3',h1:'#1d1d1f',h2:'#86566e',ac:'#ff2d55',card:'#ffe4ea',lgt:true},
  {bg:'#0a0a0f',h1:'#ffffff',h2:'#8e8e93',ac:'#bf5af2',card:'rgba(255,255,255,.06)',lgt:false},
];

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let listening    = false;
let recognition  = null;
let currentLang  = 'it-IT';
let themeIdx     = 0;
let interim      = '';
let wordBuf      = [];      // buffer of final words not yet sent to AI
let flushTimer   = null;
let aiQueue      = [];      // queued texts to generate
let aiRunning    = false;
let themeForNext = 0;

/* ════════════════════════════════════════
   WAVEFORM
════════════════════════════════════════ */
setInterval(() => {
  if (!listening) return;
  document.querySelectorAll('.wb').forEach(b => b.style.height = (3+Math.random()*14)+'px');
}, 90);

/* ════════════════════════════════════════
   TRANSCRIPT BAR
════════════════════════════════════════ */
function updateTBar() {
  const bar = document.getElementById('tBar');
  const conf = wordBuf.slice(-12).join(' ');   // last 12 confirmed words
  document.getElementById('tConf').textContent = conf + (conf && interim ? ' ' : '');
  document.getElementById('tInt').textContent  = interim;
  bar.classList.toggle('show', !!(conf || interim));
}

/* ════════════════════════════════════════
   SPEECH RECOGNITION

   KEY INSIGHT:
   - interimResults:true → we get partial text instantly
   - When a result is FINAL → the browser has committed to those words
   - We accumulate final words and trigger AI every MIN_WORDS_FOR_SLIDE finals
   - This means slides appear WHILE talking, not just on silence
════════════════════════════════════════ */
function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r      = new SR();
  r.lang           = currentLang;
  r.continuous     = true;
  r.interimResults = true;

  r.onresult = ev => {
    interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const txt = ev.results[i][0].transcript.trim();
      if (ev.results[i].isFinal) {
        // Split into words, push to buffer
        const words = txt.split(/\s+/).filter(Boolean);
        wordBuf.push(...words);

        // ── TRIGGER SLIDE while speaking ──────────────
        // Fire as soon as we have enough words confirmed
        if (wordBuf.length >= MIN_WORDS_FOR_SLIDE) {
          const text = wordBuf.join(' ');
          wordBuf    = [];
          clearTimeout(flushTimer);
          queueSlide(text);
        } else {
          // Reset silence flush timer
          clearTimeout(flushTimer);
          flushTimer = setTimeout(flushBuffer, FLUSH_MS);
        }
      } else {
        interim += (interim ? ' ' : '') + txt;
      }
    }
    updateTBar();
  };

  r.onerror = ev => { if (ev.error === 'not-allowed') stopListening(); };
  r.onend   = () => { if (listening) setTimeout(() => { try { recognition.start(); } catch(_){} }, 80); };
  return r;
}

function flushBuffer() {
  const text = wordBuf.join(' ').trim();
  wordBuf = [];
  if (text.length > 3) queueSlide(text);
}

/* ════════════════════════════════════════
   AI QUEUE — process one at a time so
   slides don't overlap/race
════════════════════════════════════════ */
function queueSlide(text) {
  // Assign theme now (before any await) so order is preserved
  const theme = themeIdx;
  themeIdx    = (themeIdx + 1) % TH.length;
  aiQueue.push({ text, theme });
  processQueue();
}

async function processQueue() {
  if (aiRunning || aiQueue.length === 0) return;
  aiRunning = true;
  const { text, theme } = aiQueue.shift();
  await callAI(text, theme);
  aiRunning = false;
  processQueue(); // process next if any
}

/* ════════════════════════════════════════
   AI CALL — fast, concise prompt
════════════════════════════════════════ */
async function callAI(text, themeI) {
  setThinking(true);

  const sys = `Genera una slide visiva da ciò che l'utente sta dicendo.
SOLO JSON valido. Zero markdown. Zero spiegazioni.

Layout disponibili:
- "tagline"  → titolo grande + sottotitolo (affermazioni, intro, concetti)
- "bullets"  → titolo + 3-4 punti (liste, caratteristiche, vantaggi)
- "metrics"  → titolo + 2-3 numeri grandi (dati, statistiche, KPI)
- "steps"    → titolo + 3-4 passi (processi, how-to, fasi)
- "quote"    → citazione + autore (principi, frasi, idee)
- "twocol"   → titolo + colonna sx / colonna dx (confronti, pro/contro)

JSON:
{
  "layout":"tagline|bullets|metrics|steps|quote|twocol",
  "tag":"2-3 PAROLE",
  "title":"Max 6 parole d'impatto",
  "subtitle":"Max 12 parole (solo tagline)",
  "items":["Punto 1","Punto 2","Punto 3"],
  "metrics":[{"value":"95%","label":"Label"},{"value":"3×","label":"Label"}],
  "quote":"Citazione",
  "author":"Autore",
  "left":["sx1","sx2"],
  "right":["dx1","dx2"],
  "leftTitle":"Pro","rightTitle":"Contro"
}

REGOLE:
- Usa il layout più adatto al contenuto
- Se ci sono numeri → usa "metrics"
- Titoli brevi, punti max 8 parole
- Stessa lingua dell'utente`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body: JSON.stringify({
        model: GROQ_MODEL,
        max_tokens: 320,
        temperature: 0.35,
        messages:[{role:'system',content:sys},{role:'user',content:text}]
      })
    });
    const data = await res.json();
    const raw  = (data.choices?.[0]?.message?.content||'').replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch {
      const m = raw.match(/\{[\s\S]*\}/);
      try   { parsed = JSON.parse(m?.[0]||'{}'); }
      catch { parsed = {layout:'tagline',tag:'SLIDE',title:text.split(' ').slice(0,5).join(' '),subtitle:text.slice(0,60)}; }
    }
    renderSlide(parsed, themeI);
  } catch(e) {
    setThinking(false);
  }
}

/* ════════════════════════════════════════
   RENDER
════════════════════════════════════════ */
function renderSlide(d, themeI) {
  const t   = TH[themeI % TH.length];
  const html = buildLayout(d, t);
  const el   = document.getElementById('slide');
  el.classList.add('out');
  setTimeout(() => {
    el.innerHTML = html;
    el.classList.remove('out');
    setThinking(false);
  }, 190);
}

function setThinking(on) {
  const wrap = document.getElementById('slideWrap');
  const bar  = document.getElementById('thinkBar');
  const badge = document.getElementById('badge');
  if (on) {
    wrap.classList.remove('on'); wrap.classList.add('thinking');
    bar.classList.add('show');
    badge.className = 'show thinking';
    document.getElementById('blabel').textContent = 'Genero…';
  } else {
    wrap.classList.remove('thinking');
    bar.classList.remove('show');
    if (listening) {
      wrap.classList.add('on');
      badge.className = 'show';
      document.getElementById('blabel').textContent = 'In ascolto';
    } else {
      badge.className = '';
      wrap.className  = '';
    }
  }
}

/* ════════════════════════════════════════
   LAYOUT BUILDERS
════════════════════════════════════════ */
function buildLayout(d, t) {
  switch(d.layout) {
    case 'bullets':  return lBullets(d,t);
    case 'metrics':  return lMetrics(d,t);
    case 'steps':    return lSteps(d,t);
    case 'quote':    return lQuote(d,t);
    case 'twocol':   return lTwoCol(d,t);
    default:         return lTagline(d,t);
  }
}

const x  = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dot = t => `<div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,${t.ac}00,${t.ac},${t.ac}00);pointer-events:none;"></div>`;
const blobs = t => `<div style="position:absolute;top:-20%;right:-12%;width:46%;aspect-ratio:1;border-radius:50%;background:${t.ac}10;filter:blur(70px);pointer-events:none;"></div><div style="position:absolute;bottom:-18%;left:-10%;width:36%;aspect-ratio:1;border-radius:50%;background:${t.ac}0a;filter:blur(55px);pointer-events:none;"></div>`;
const grd = t => `background-image:radial-gradient(${t.lgt?'rgba(0,0,0,.028)':'rgba(255,255,255,.02)'} 1px,transparent 1px);background-size:26px 26px;`;
const pill = (d,t) => `<div style="display:inline-flex;align-items:center;background:${t.ac}18;border:1px solid ${t.ac}26;border-radius:20px;padding:5px 14px;margin-bottom:4%;"><span style="font-size:9px;font-weight:700;letter-spacing:1.8px;color:${t.ac};text-transform:uppercase;">${x(d.tag||'SLIDE')}</span></div>`;
const sep = t => t.lgt ? 'rgba(0,0,0,.065)' : 'rgba(255,255,255,.065)';

function lTagline(d,t){
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9% 12%;position:relative;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;text-align:center;">
  ${blobs(t)}
  <div style="z-index:1;display:flex;flex-direction:column;align-items:center;">
    ${pill(d,t)}
    <h1 style="font-size:clamp(28px,5.5vw,66px);font-weight:800;color:${t.h1};line-height:1.04;letter-spacing:-2.5px;margin-bottom:${d.subtitle?'3%':'0'};max-width:860px;">${x(d.title)}</h1>
    ${d.subtitle?`<p style="font-size:clamp(14px,1.9vw,22px);color:${t.h2};line-height:1.5;max-width:600px;font-weight:400;">${x(d.subtitle)}</p>`:''}
  </div>
  ${dot(t)}</div>`;}

function lBullets(d,t){
  const items=(d.items||[]).slice(0,4);
  const s=sep(t);
  const rows=items.map((b,i)=>`
  <div style="display:flex;align-items:flex-start;gap:3.5%;padding:2.8% 0;${i<items.length-1?`border-bottom:1px solid ${s};`:''}">
    <div style="min-width:clamp(24px,3.2vw,36px);height:clamp(24px,3.2vw,36px);border-radius:9px;background:${t.ac}18;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.4vw,15px);font-weight:800;color:${t.ac};flex-shrink:0;">${i+1}</div>
    <span style="font-size:clamp(13px,1.7vw,20px);color:${t.h1};line-height:1.45;font-weight:450;padding-top:1px;opacity:.92;">${x(b)}</span>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative;">
  <div style="padding:5.5% 7% 3.5%;border-bottom:1px solid ${s};flex-shrink:0;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'PUNTI CHIAVE')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;line-height:1.1;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;padding:0 7%;display:flex;flex-direction:column;justify-content:center;">${rows}</div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,${t.ac},${t.ac}00);"></div>
  ${dot(t)}</div>`;}

function lMetrics(d,t){
  const mets=(d.metrics||[]).slice(0,3);
  const s=sep(t);
  const cards=mets.map(m=>`
  <div style="flex:1;min-width:0;background:${t.card};border-radius:clamp(14px,2.2vw,24px);padding:6% 4%;text-align:center;border:1px solid ${s};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;">
    <div style="font-size:clamp(34px,7vw,78px);font-weight:900;color:${t.ac};letter-spacing:-3px;line-height:1;">${x(m.value)}</div>
    <div style="font-size:clamp(9px,1.1vw,13px);font-weight:600;color:${t.h2};letter-spacing:1px;text-transform:uppercase;">${x(m.label)}</div>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  ${blobs(t)}
  <div style="margin-bottom:5%;position:relative;z-index:1;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'DATI')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;align-items:stretch;gap:3.5%;position:relative;z-index:1;">${cards}</div>
  ${dot(t)}</div>`;}

function lSteps(d,t){
  const items=(d.items||[]).slice(0,4);
  const cols=items.map((s,i)=>`
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:12%;position:relative;">
    ${i<items.length-1?`<div style="position:absolute;top:11%;left:55%;width:90%;height:2px;background:linear-gradient(90deg,${t.ac}50,${t.ac}10);z-index:0;"></div>`:''}
    <div style="width:clamp(34px,4.8vw,56px);height:clamp(34px,4.8vw,56px);border-radius:50%;background:${t.ac};display:flex;align-items:center;justify-content:center;font-size:clamp(14px,1.9vw,22px);font-weight:800;color:#fff;z-index:1;flex-shrink:0;box-shadow:0 4px 16px ${t.ac}44;">${i+1}</div>
    <div style="font-size:clamp(11px,1.3vw,15px);color:${t.h1};line-height:1.4;font-weight:500;text-align:center;opacity:.9;">${x(s)}</div>
  </div>`).join('');
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  <div style="margin-bottom:7%;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'STEPS')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;align-items:center;gap:0;">${cols}</div>
  ${dot(t)}</div>`;}

function lQuote(d,t){
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10% 14%;position:relative;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;text-align:center;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,${t.ac}0d 0%,transparent 68%);pointer-events:none;"></div>
  <div style="font-size:clamp(56px,12vw,120px);line-height:.7;color:${t.ac};font-weight:800;opacity:.15;margin-bottom:3%;z-index:1;font-family:Georgia,serif;">"</div>
  <p style="font-size:clamp(17px,2.9vw,34px);font-weight:500;color:${t.h1};line-height:1.48;max-width:720px;font-style:italic;z-index:1;letter-spacing:-.3px;">${x(d.quote||d.title)}</p>
  <div style="width:40px;height:2px;background:${t.ac};border-radius:1px;margin:5% auto;z-index:1;"></div>
  ${d.author?`<div style="font-size:clamp(12px,1.4vw,16px);font-weight:600;color:${t.h2};z-index:1;">— ${x(d.author)}</div>`:''}
  ${dot(t)}</div>`;}

function lTwoCol(d,t){
  const L=(d.left||[]).slice(0,4), R=(d.right||[]).slice(0,4);
  const col=(items,color,title)=>`
  <div style="flex:1;background:${color}10;border-radius:16px;padding:5%;border:1px solid ${color}20;">
    <div style="font-size:clamp(11px,1.3vw,15px);font-weight:700;color:${color};margin-bottom:4%;">${x(title)}</div>
    ${items.map(i=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:3%;"><span style="color:${color};font-weight:700;flex-shrink:0;">•</span><span style="font-size:clamp(11px,1.3vw,15px);color:${t.h1};line-height:1.4;opacity:.9;">${x(i)}</span></div>`).join('')}
  </div>`;
  return `<div style="width:100%;height:100%;background:${t.bg};${grd(t)}display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;padding:5.5% 6%;overflow:hidden;position:relative;">
  <div style="margin-bottom:4%;">
    <div style="font-size:clamp(8px,.9vw,10px);font-weight:700;letter-spacing:2px;color:${t.ac};text-transform:uppercase;margin-bottom:1.8%;">${x(d.tag||'CONFRONTO')}</div>
    <h2 style="font-size:clamp(20px,2.9vw,36px);font-weight:700;color:${t.h1};letter-spacing:-1.2px;">${x(d.title)}</h2>
  </div>
  <div style="flex:1;display:flex;gap:3.5%;">
    ${col(L,t.ac,d.leftTitle||'Vantaggi')}
    ${col(R,'#ff3b30',d.rightTitle||'Svantaggi')}
  </div>
  ${dot(t)}</div>`;}

/* ════════════════════════════════════════
   MIC
════════════════════════════════════════ */
function toggleMic(){ listening ? stopListening() : startListening(); }

function startListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Usa Chrome o Safari.'); return; }
  listening = true;
  wordBuf = []; interim = '';
  if(recognition){ try{ recognition.abort(); }catch(_){} }
  recognition = buildRecognition();
  try{ recognition.start(); }catch(_){}
  document.getElementById('mic').className   = 'on';
  document.getElementById('mic').textContent  = '⏹';
  document.getElementById('wave').className   = 'on';
  document.getElementById('slideWrap').classList.add('on');
  document.getElementById('badge').className  = 'show';
  document.getElementById('blabel').textContent = 'In ascolto';
}

function stopListening(){
  listening = false;
  clearTimeout(flushTimer);
  if(recognition){ try{ recognition.abort(); }catch(_){} }
  // Flush whatever is left in buffer
  const text = [...wordBuf, ...(interim.trim().split(/\s+/).filter(Boolean))].join(' ').trim();
  wordBuf = []; interim = '';
  updateTBar();
  document.getElementById('mic').className   = '';
  document.getElementById('mic').textContent  = '🎤';
  document.getElementById('wave').className   = '';
  document.querySelectorAll('.wb').forEach(b => b.style.height='4px');
  document.getElementById('tBar').classList.remove('show');
  document.getElementById('badge').className  = '';
  document.getElementById('slideWrap').className = '';
  if(text.length > 3) queueSlide(text);
}

/* ════════════════════════════════════════
   MANUAL
════════════════════════════════════════ */
function sendManual(){
  const inp = document.getElementById('manIn');
  const t   = inp.value.trim(); if(!t) return;
  inp.value = '';
  queueSlide(t);
}

/* ════════════════════════════════════════
   LANGUAGE
════════════════════════════════════════ */
function toggleLangMenu(){ document.getElementById('langMenu').classList.toggle('show'); }
function setLang(code, flag, name){
  currentLang = code;
  document.getElementById('langFlag').textContent = flag;
  document.getElementById('langName').textContent = name;
  document.getElementById('langMenu').classList.remove('show');
  document.querySelectorAll('.langOpt').forEach(el => el.classList.toggle('active', el.textContent.trim().startsWith(flag)));
  if(listening){
    if(recognition){ try{ recognition.abort(); }catch(_){} }
    recognition = buildRecognition();
    setTimeout(()=>{ try{ recognition.start(); }catch(_){} }, 150);
  }
}
document.addEventListener('click', e => {
  if(!e.target.closest('#langBtn') && !e.target.closest('#langMenu'))
    document.getElementById('langMenu').classList.remove('show');
});

/* ════════════════════════════════════════
   FULLSCREEN
════════════════════════════════════════ */
function toggleFS(){
  const el = document.getElementById('slideWrap');
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    document.body.classList.remove('fs');
  } else {
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    document.body.classList.add('fs');
  }
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('fs'); });
</script>
