<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Slide Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2ede8;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --accent:#0071e3;
  --red:#ff3b30;
  --green:#34c759;
  --orange:#ff9f0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);}

body {
background: var(–bg);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 24px 24px 108px;
}

/* ── SLIDE ───────────────────────────────────── */
#slideWrap {
width: 100%;
max-width: 1080px;
aspect-ratio: 16/9;
border-radius: 20px;
overflow: hidden;
box-shadow: 0 12px 60px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
background: #fff;
position: relative;
border: 2px solid transparent;
transition: border-color .25s, box-shadow .25s;
flex-shrink: 0;
}
#slideWrap.live  { border-color:rgba(0,113,227,.45); box-shadow:0 0 0 4px rgba(0,113,227,.1),0 12px 60px rgba(0,0,0,.18); }
#slideWrap.ai    { border-color:rgba(255,159,10,.55); box-shadow:0 0 0 4px rgba(255,159,10,.1),0 12px 60px rgba(0,0,0,.18); }

#slide {
width:100%; height:100%;
transition: opacity .18s ease, transform .25s cubic-bezier(.16,1,.3,1);
}
#slide.out { opacity:0; transform:scale(.975); }

/* blinking cursor */
.cur {
display:inline-block; width:2px; height:.88em;
background:currentColor; margin-left:3px;
border-radius:1px; vertical-align:text-bottom;
animation:cur .7s steps(1) infinite;
}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ── OVERLAY BADGES ──────────────────────────── */
#badge {
position:absolute; top:14px; left:14px;
display:none; align-items:center; gap:7px;
background:rgba(255,255,255,0.82);
backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
border:1px solid rgba(0,0,0,0.09);
border-radius:30px; padding:5px 13px;
font-size:12px; font-weight:600; color:#1d1d1f;
box-shadow:0 2px 10px rgba(0,0,0,.09);
z-index:10; pointer-events:none;
}
#badge.show{display:flex;}
#badgeDot{width:7px;height:7px;border-radius:50%;background:var(–accent);animation:blink 1.1s infinite;}
#badge.ai #badgeDot{background:var(–orange);}

#fsBtn {
position:absolute; top:14px; right:14px;
width:40px; height:40px; border-radius:50%;
background:rgba(255,255,255,0.78);
backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
border:1px solid rgba(0,0,0,0.09);
display:flex; align-items:center; justify-content:center;
cursor:pointer; font-size:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
transition:all .2s; z-index:10;
}
#fsBtn:hover{background:rgba(255,255,255,.96);transform:scale(1.08);}
#fsBtn:active{transform:scale(.9);}

/* ── FLOATING CONTROLS ───────────────────────── */
#controls {
position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
display:flex; align-items:center; gap:12px; z-index:100;
}

/* waveform */
#wave {
display:flex; gap:2.5px; align-items:center; height:22px;
opacity:0; transition:opacity .3s;
}
#wave.on{opacity:1;}
.wb{width:2.5px;border-radius:2px;background:rgba(0,0,0,0.25);height:4px;transition:height .09s ease;}

/* mic */
#mic {
width:66px; height:66px; border-radius:50%;
border:none; background:var(–red); color:#fff;
font-size:27px; cursor:pointer;
display:flex; align-items:center; justify-content:center;
box-shadow:0 4px 20px rgba(255,59,48,.38),0 2px 6px rgba(0,0,0,.14);
transition:all .22s cubic-bezier(.34,1.56,.64,1);
position:relative; flex-shrink:0;
}
#mic:hover{transform:scale(1.07);}
#mic:active{transform:scale(.91);}
#mic.on{background:var(–accent);box-shadow:0 4px 22px rgba(0,113,227,.42),0 2px 6px rgba(0,0,0,.14);}
#mic.on::before{content:’’;position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(0,113,227,.22);animation:rip 1.9s ease-out infinite;}
#mic.on::after {content:’’;position:absolute;inset:-19px;border-radius:50%;border:1.5px solid rgba(0,113,227,.1);animation:rip 1.9s ease-out .65s infinite;}
@keyframes rip{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.2)}}

/* text input pill */
#inputPill {
display:flex; align-items:center; gap:9px;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
border:1px solid rgba(0,0,0,0.1);
border-radius:30px; padding:9px 9px 9px 16px;
box-shadow:0 4px 20px rgba(0,0,0,.12);
min-width:200px;
}
#manIn {
flex:1; border:none; outline:none;
background:transparent; font-family:var(–font);
font-size:14px; font-weight:500; color:#1d1d1f;
min-width:0;
}
#manIn::placeholder{color:#aeaeb2;}
#sendBtn {
width:34px; height:34px; border-radius:50%;
background:var(–accent); color:#fff; border:none;
font-size:16px; cursor:pointer; flex-shrink:0;
display:flex; align-items:center; justify-content:center;
transition:all .18s;
}
#sendBtn:hover{background:#0077ed;transform:scale(1.08);}
#sendBtn:active{transform:scale(.88);}

/* ── EMPTY ───────────────────────────────────── */
#empty {
width:100%; height:100%; background:#fff;
display:flex; flex-direction:column;
align-items:center; justify-content:center;
gap:14px; font-family:var(–font);
}
.ei{font-size:48px;opacity:.22;}
.et{font-size:20px;font-weight:700;color:#1d1d1f;letter-spacing:-.5px;}
.es{font-size:14px;color:#6e6e73;text-align:center;max-width:260px;line-height:1.5;}

/* ── FULLSCREEN ──────────────────────────────── */
body.fs{padding:0;background:#000;}
body.fs #slideWrap{max-width:100%;width:100vw;height:100dvh;aspect-ratio:unset;border-radius:0;border:none;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

/* ── MOBILE ──────────────────────────────────── */
@media(max-width:580px){
body{padding:12px 10px 96px;}
#mic{width:58px;height:58px;font-size:23px;}
#inputPill{min-width:150px;padding:8px 8px 8px 13px;}
#manIn{font-size:13px;}
}
</style>

</head>
<body>

<div id="slideWrap">
  <div id="slide">
    <div id="empty">
      <div class="ei">🎤</div>
      <div class="et">Premi e parla</div>
      <div class="es">La slide cambia in tempo reale mentre parli</div>
    </div>
  </div>

  <div id="badge"><div id="badgeDot"></div><span id="badgeLabel">Live</span></div>
  <button id="fsBtn" onclick="toggleFS()">⛶</button>
</div>

<div id="controls">
  <div id="wave">
    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    <div class="wb"></div><div class="wb"></div>
  </div>

<button id="mic" onclick="toggleMic()">🎤</button>

  <div id="inputPill">
    <input id="manIn" type="text" placeholder="Scrivi argomento…"
      onkeydown="if(event.key==='Enter')sendManual()"/>
    <button id="sendBtn" onclick="sendManual()">↑</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CONFIG
══════════════════════════════════════════ */
const GROQ_KEY   = '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';
const GROQ_MODEL = 'llama-3.3-70b-versatile';

// After this ms of silence → call AI to polish
const SILENCE_MS = 1600;

// Themes rotate per AI-polish (not per word)
const THEMES = [
  {bg:'#ffffff',h1:'#1d1d1f',h2:'#6e6e73',ac:'#0071e3',card:'#f5f5f7',lgt:true},
  {bg:'#1d1d1f',h1:'#f5f5f7',h2:'#a1a1a6',ac:'#2997ff',card:'#2c2c2e',lgt:false},
  {bg:'#001d3d',h1:'#ffffff',h2:'#90c2e7',ac:'#ffd60a',card:'rgba(255,255,255,0.08)',lgt:false},
  {bg:'#faf5eb',h1:'#2c2c2c',h2:'#7a6a52',ac:'#d97706',card:'#fff8e7',lgt:true},
  {bg:'#1a2e1a',h1:'#f0faf0',h2:'#86c88a',ac:'#34c759',card:'rgba(255,255,255,0.07)',lgt:false},
  {bg:'#2c2c2e',h1:'#f5f5f7',h2:'#98989d',ac:'#ff9f0a',card:'#3a3a3c',lgt:false},
  {bg:'#fff0f3',h1:'#1d1d1f',h2:'#86566e',ac:'#ff2d55',card:'#ffe4ea',lgt:true},
  {bg:'#0a0a0f',h1:'#ffffff',h2:'#8e8e93',ac:'#bf5af2',card:'rgba(255,255,255,0.06)',lgt:false},
];

/* ══════════════════════════════════════════
   STATE — minimal, single-slide
══════════════════════════════════════════ */
let listening  = false;
let aiRunning  = false;
let aiAbort    = null;   // AbortController for in-flight requests
let themeIdx   = 0;      // increments only on AI polish
let interim    = '';     // current partial speech
let confirmed  = '';     // finalised speech since last AI call
let silTimer   = null;
let recognition = null;

/* ══════════════════════════════════════════
   WAVEFORM
══════════════════════════════════════════ */
setInterval(() => {
  if (!listening) return;
  document.querySelectorAll('.wb').forEach(b => {
    b.style.height = (3 + Math.random() * 14) + 'px';
  });
}, 90);

/* ══════════════════════════════════════════
   SPEECH
══════════════════════════════════════════ */
(function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('manIn').placeholder = 'Microfono non disponibile — scrivi qui';
    document.getElementById('mic').style.opacity = '.3';
    document.getElementById('mic').onclick = null;
    return;
  }
  recognition = new SR();
  recognition.lang          = 'it-IT';
  recognition.continuous    = true;
  recognition.interimResults = true;  // instant partial results

  recognition.onresult = ev => {
    let fin = '';
    let int = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const txt = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) fin += txt;
      else int += txt;
    }

    interim = int;
    if (fin) confirmed += ' ' + fin.trim();

    // ── Paint live slide immediately (no AI) ──
    const full = (confirmed + ' ' + interim).trim();
    if (full.length > 1) paintLive(full);

    // ── Restart silence timer ──
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      const text = confirmed.trim();
      confirmed = '';
      interim   = '';
      if (text.length > 5) callAI(text);
    }, SILENCE_MS);
  };

  recognition.onerror = ev => {
    if (ev.error === 'not-allowed') stopListening();
  };
  recognition.onend = () => {
    if (listening) { try { recognition.start(); } catch (_) {} }
  };
})();

function toggleMic() {
  listening ? stopListening() : startListening();
}
function startListening() {
  if (!recognition) return;
  listening = true;
  try { recognition.start(); } catch (_) {}
  document.getElementById('mic').className  = 'on';
  document.getElementById('mic').textContent = '⏹';
  document.getElementById('wave').className  = 'on';
  showBadge('live', 'In ascolto');
}
function stopListening() {
  listening = false;
  try { recognition.stop(); } catch (_) {}
  clearTimeout(silTimer);
  document.getElementById('mic').className  = '';
  document.getElementById('mic').textContent = '🎤';
  document.getElementById('wave').className  = '';
  document.querySelectorAll('.wb').forEach(b => b.style.height = '4px');
  hideBadge();
  // flush remaining text
  const text = confirmed.trim();
  confirmed = ''; interim = '';
  if (text.length > 5 && !aiRunning) callAI(text);
}

/* ══════════════════════════════════════════
   LIVE PAINT  — instant, no AI, overwrites
══════════════════════════════════════════ */
function paintLive(text) {
  const t = THEMES[themeIdx % THEMES.length];
  const words = text.trim().split(/\s+/);
  const title = words.slice(0, 7).join(' ');
  const body  = words.slice(7).join(' ');

  const html = `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:9% 11%;position:relative;overflow:hidden;
    font-family:'Inter',-apple-system,sans-serif;text-align:center;">
    <div style="position:absolute;inset:0;background-image:radial-gradient(
      ${t.lgt?'rgba(0,0,0,.032)':'rgba(255,255,255,.022)'} 1px,transparent 1px);
      background-size:24px 24px;"></div>
    <div style="position:absolute;top:-18%;right:-12%;width:44%;aspect-ratio:1;
      border-radius:50%;background:${t.ac}12;filter:blur(64px);"></div>
    <div style="display:inline-flex;align-items:center;background:${t.ac}1a;
      border:1px solid ${t.ac}28;border-radius:20px;padding:5px 14px;margin-bottom:4%;z-index:1;">
      <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;
        color:${t.ac};text-transform:uppercase;">LIVE</span>
    </div>
    <h1 style="font-size:clamp(22px,5vw,58px);font-weight:800;color:${t.h1};
      line-height:1.04;letter-spacing:-2px;margin-bottom:3%;z-index:1;max-width:820px;">
      ${x(title)}<span class="cur" style="background:${t.ac};"></span>
    </h1>
    ${body ? `<p style="font-size:clamp(13px,1.9vw,21px);color:${t.h2};
      line-height:1.55;max-width:580px;z-index:1;">${x(body)}</p>` : ''}
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,${t.ac}00,${t.ac},${t.ac}00);"></div>
  </div>`;

  setSlide(html, false);
  document.getElementById('slideWrap').className = 'live';
  showBadge('live', 'Live');
}

/* ══════════════════════════════════════════
   AI POLISH  — replaces slide when done
   Cancels previous in-flight request
══════════════════════════════════════════ */
async function callAI(text) {
  // Cancel any previous pending AI call
  if (aiAbort) { aiAbort.abort(); aiAbort = null; }

  aiRunning = true;
  aiAbort   = new AbortController();
  document.getElementById('slideWrap').className = 'ai';
  showBadge('ai', 'AI…');

  const sys = `Sei un generatore di slide Apple Keynote. SOLO JSON valido, zero markdown.
Schema:
{
  "type":"title|bullets|stats|quote|image",
  "tag":"KEYWORD",
  "title":"max 6 parole incisive",
  "subtitle":"max 14 parole (solo title/image)",
  "bullets":["p1","p2","p3","p4"],
  "stats":[{"value":"87%","label":"Label"},{"value":"3×","label":"Label"}],
  "quote":"citazione breve"
}
Scegli: title→introduzione, bullets→lista/processo, stats→numeri/dati, quote→principio, image→visivo.
Italiano. Conciso. Alta densità informativa.`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      signal: aiAbort.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_KEY
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        max_tokens: 400,
        temperature: 0.55,
        messages: [
          { role: 'system', content: sys },
          { role: 'user',   content: '"' + text + '"' }
        ]
      })
    });

    const data = await res.json();
    const raw  = (data.choices?.[0]?.message?.content || '')
                  .replace(/```json|```/g, '').trim();

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch {
      parsed = {
        type: 'title',
        tag: 'AI',
        title: text.split(' ').slice(0, 5).join(' '),
        subtitle: text
      };
    }

    // Advance theme for next slide
    themeIdx++;

    const html = buildSlide(parsed, themeIdx - 1);
    setSlide(html, true);
    document.getElementById('slideWrap').className = listening ? 'live' : '';
    showBadge(listening ? 'live' : '', listening ? 'In ascolto' : '');
    if (!listening) hideBadge();

  } catch (err) {
    if (err.name !== 'AbortError') {
      document.getElementById('slideWrap').className = '';
      hideBadge();
    }
  }

  aiRunning = false;
  aiAbort   = null;
}

/* ══════════════════════════════════════════
   MANUAL INPUT
══════════════════════════════════════════ */
function sendManual() {
  const inp  = document.getElementById('manIn');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  confirmed = ''; interim = '';
  clearTimeout(silTimer);
  callAI(text);
}

/* ══════════════════════════════════════════
   SLIDE RENDER
══════════════════════════════════════════ */
function setSlide(html, animate) {
  const el = document.getElementById('slide');
  if (animate) {
    el.classList.add('out');
    setTimeout(() => {
      el.innerHTML = html;
      el.classList.remove('out');
    }, 170);
  } else {
    el.innerHTML = html;
    el.classList.remove('out');
  }
}

/* ══════════════════════════════════════════
   BADGE
══════════════════════════════════════════ */
function showBadge(type, label) {
  const b = document.getElementById('badge');
  b.className = 'show' + (type === 'ai' ? ' ai' : '');
  document.getElementById('badgeLabel').textContent = label;
}
function hideBadge() {
  document.getElementById('badge').className = '';
}

/* ══════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════ */
function toggleFS() {
  const el  = document.getElementById('slideWrap');
  const btn = document.getElementById('fsBtn');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    btn.textContent = '⛶';
    document.body.classList.remove('fs');
  } else {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    btn.textContent = '✕';
    document.body.classList.add('fs');
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('fsBtn').textContent = '⛶';
    document.body.classList.remove('fs');
  }
});

/* ══════════════════════════════════════════
   HTML BUILDERS
══════════════════════════════════════════ */
function buildSlide(d, idx) {
  const t = THEMES[idx % THEMES.length];
  switch (d.type) {
    case 'bullets': return sBullets(d, t);
    case 'stats':   return sStats(d, t);
    case 'quote':   return sQuote(d, t);
    case 'image':   return sImage(d, t, idx);
    default:        return sTitle(d, t);
  }
}

function x(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sTitle(d, t) {
  return `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:9% 12%;position:relative;overflow:hidden;
    font-family:'Inter',-apple-system,sans-serif;text-align:center;">
    <div style="position:absolute;inset:0;background-image:radial-gradient(
      ${t.lgt?'rgba(0,0,0,.032)':'rgba(255,255,255,.022)'} 1px,transparent 1px);
      background-size:24px 24px;"></div>
    <div style="position:absolute;top:-18%;right:-12%;width:44%;aspect-ratio:1;
      border-radius:50%;background:${t.ac}12;filter:blur(64px);"></div>
    <div style="position:absolute;bottom:-14%;left:-10%;width:36%;aspect-ratio:1;
      border-radius:50%;background:${t.ac}0c;filter:blur(48px);"></div>
    <div style="display:inline-flex;align-items:center;background:${t.ac}1a;
      border:1px solid ${t.ac}28;border-radius:20px;padding:5px 14px;margin-bottom:5%;z-index:1;">
      <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;
        color:${t.ac};text-transform:uppercase;">${x(d.tag||'SLIDE')}</span>
    </div>
    <h1 style="font-size:clamp(24px,5.2vw,60px);font-weight:800;color:${t.h1};
      line-height:1.04;letter-spacing:-2.5px;margin-bottom:3%;z-index:1;max-width:820px;">
      ${x(d.title)}
    </h1>
    ${d.subtitle ? `<p style="font-size:clamp(13px,1.9vw,21px);color:${t.h2};
      line-height:1.55;max-width:560px;font-weight:400;z-index:1;">${x(d.subtitle)}</p>` : ''}
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,${t.ac}00,${t.ac},${t.ac}00);"></div>
  </div>`;
}

function sBullets(d, t) {
  const bl = (d.bullets || []).slice(0, 4);
  const rows = bl.map((b, i) => `
    <div style="display:flex;align-items:flex-start;gap:4%;padding:2.5% 0;
      ${i < bl.length-1 ? `border-bottom:1px solid ${t.lgt?'rgba(0,0,0,.06)':'rgba(255,255,255,.06)'};`:``}">
      <div style="width:clamp(22px,3vw,32px);height:clamp(22px,3vw,32px);border-radius:8px;
        background:${t.ac}1a;display:flex;align-items:center;justify-content:center;
        flex-shrink:0;font-size:clamp(11px,1.4vw,15px);font-weight:700;color:${t.ac};margin-top:.5%;">
        ${i+1}
      </div>
      <div style="font-size:clamp(12px,1.7vw,19px);color:${t.h1};line-height:1.45;
        font-weight:400;opacity:.88;padding-top:.8%;">${x(b)}</div>
    </div>`).join('');
  return `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;
    font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative;">
    <div style="padding:6% 8% 4%;border-bottom:1px solid
      ${t.lgt?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)'};">
      <div style="font-size:clamp(8px,1vw,11px);font-weight:700;letter-spacing:1.5px;
        color:${t.ac};text-transform:uppercase;margin-bottom:2%;">${x(d.tag||'OVERVIEW')}</div>
      <h2 style="font-size:clamp(18px,2.9vw,34px);font-weight:700;color:${t.h1};
        letter-spacing:-1.2px;line-height:1.1;">${x(d.title)}</h2>
    </div>
    <div style="flex:1;padding:2% 8% 5%;display:flex;flex-direction:column;
      justify-content:center;">${rows}</div>
    <div style="position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(180deg,${t.ac},${t.ac}00);"></div>
  </div>`;
}

function sStats(d, t) {
  const st = (d.stats || []).slice(0, 3);
  const cards = st.map(s => `
    <div style="flex:1;min-width:0;background:${t.card};border-radius:clamp(12px,2vw,22px);
      padding:6% 4%;text-align:center;border:1px solid
      ${t.lgt?'rgba(0,0,0,.06)':'rgba(255,255,255,.07)'};">
      <div style="font-size:clamp(30px,6vw,66px);font-weight:800;color:${t.ac};
        letter-spacing:-3px;line-height:1;">${x(s.value)}</div>
      <div style="font-size:clamp(9px,1.1vw,13px);font-weight:600;color:${t.h2};
        letter-spacing:.8px;text-transform:uppercase;margin-top:8%;">${x(s.label)}</div>
    </div>`).join('');
  return `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;
    font-family:'Inter',-apple-system,sans-serif;padding:6% 7%;overflow:hidden;position:relative;">
    <div style="position:absolute;top:-15%;right:-10%;width:40%;aspect-ratio:1;
      border-radius:50%;background:${t.ac}10;filter:blur(50px);"></div>
    <div style="margin-bottom:6%;position:relative;z-index:1;">
      <div style="font-size:clamp(8px,1vw,11px);font-weight:700;letter-spacing:1.5px;
        color:${t.ac};text-transform:uppercase;margin-bottom:2%;">${x(d.tag||'DATI')}</div>
      <h2 style="font-size:clamp(18px,2.9vw,34px);font-weight:700;color:${t.h1};
        letter-spacing:-1.2px;">${x(d.title)}</h2>
    </div>
    <div style="flex:1;display:flex;align-items:center;gap:4%;
      position:relative;z-index:1;">${cards}</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,${t.ac},${t.ac}00);"></div>
  </div>`;
}

function sQuote(d, t) {
  const q  = d.quote || d.title;
  const au = (d.quote && d.title) ? d.title : null;
  return `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:10% 14%;font-family:'Inter',-apple-system,sans-serif;
    position:relative;overflow:hidden;text-align:center;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,
      ${t.ac}0d 0%,transparent 68%);"></div>
    <div style="font-size:clamp(50px,11vw,108px);line-height:.72;color:${t.ac};
      font-weight:800;opacity:.17;margin-bottom:4%;z-index:1;font-family:Georgia,serif;">"</div>
    <p style="font-size:clamp(16px,2.9vw,32px);font-weight:500;color:${t.h1};
      line-height:1.5;max-width:700px;font-style:italic;z-index:1;letter-spacing:-.3px;">${x(q)}</p>
    <div style="width:38px;height:2px;background:${t.ac};border-radius:1px;margin:5% auto;z-index:1;"></div>
    ${au ? `<div style="font-size:clamp(11px,1.3vw,15px);font-weight:600;
      color:${t.h2};z-index:1;">${x(au)}</div>` : ''}
    <div style="font-size:clamp(8px,1vw,11px);font-weight:700;letter-spacing:1.5px;
      color:${t.ac};text-transform:uppercase;margin-top:3%;z-index:1;opacity:.6;">
      ${x(d.tag||'CITAZIONE')}</div>
  </div>`;
}

function sImage(d, t, idx) {
  const ems = ['🌐','🧠','💼','🏆','🔬','📱','🎨','⚙️','🌍','📡'];
  const em  = ems[idx % ems.length];
  const bl  = (d.bullets || []).slice(0, 3).map(b => `
    <div style="display:flex;align-items:center;gap:3%;margin-bottom:3%;">
      <div style="width:6px;height:6px;border-radius:50%;background:${t.ac};
        opacity:.7;flex-shrink:0;"></div>
      <span style="font-size:clamp(11px,1.5vw,17px);color:${t.h2};">${x(b)}</span>
    </div>`).join('');
  return `
  <div style="width:100%;height:100%;background:${t.bg};display:flex;
    font-family:'Inter',-apple-system,sans-serif;overflow:hidden;">
    <div style="width:38%;background:${t.ac};display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:8%;padding:8% 5%;flex-shrink:0;
      position:relative;overflow:hidden;">
      <div style="position:absolute;top:-15%;left:-15%;width:60%;aspect-ratio:1;
        border-radius:50%;background:rgba(255,255,255,.12);"></div>
      <div style="position:absolute;bottom:-12%;right:-12%;width:50%;aspect-ratio:1;
        border-radius:50%;background:rgba(255,255,255,.08);"></div>
      <div style="font-size:clamp(38px,7vw,70px);z-index:1;
        filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));">${em}</div>
      <div style="font-size:clamp(8px,1vw,11px);letter-spacing:2px;
        color:rgba(255,255,255,.75);font-weight:700;text-transform:uppercase;z-index:1;">
        ${x(d.tag||'LIVE')}</div>
    </div>
    <div style="flex:1;padding:7% 7%;display:flex;flex-direction:column;justify-content:center;">
      <h2 style="font-size:clamp(16px,2.6vw,30px);font-weight:700;color:${t.h1};
        margin-bottom:4%;letter-spacing:-.7px;line-height:1.15;">${x(d.title)}</h2>
      ${d.subtitle ? `<p style="font-size:clamp(11px,1.5vw,17px);color:${t.h2};
        line-height:1.55;margin-bottom:5%;">${x(d.subtitle)}</p>` : ''}
      ${bl}
    </div>
  </div>`;
}
</script>

</body>
</html>
