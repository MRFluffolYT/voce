<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VoiceSlide — AI Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0e0c09; color: #f0ece3; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0e0c09; }
  ::-webkit-scrollbar-thumb { background: #2a2418; border-radius: 2px; }

@keyframes slideIn { from { opacity:0; transform: translateY(20px) scale(0.97); } to { opacity:1; transform: none; } }
@keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: none; } }
@keyframes scaleIn { from { opacity:0; transform: scale(0.5); } to { opacity:1; transform: scale(1); } }
@keyframes wave { from { transform: scaleY(0.4); } to { transform: scaleY(1.3); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,96,96,0.4), 0 8px 32px rgba(224,96,96,0.3); } 50% { box-shadow: 0 0 0 12px rgba(224,96,96,0), 0 8px 32px rgba(224,96,96,0.15); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes glow { 0%,100% { opacity:0.03; } 50% { opacity:0.07; } }

#app { min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
header {
padding: 16px 24px;
border-bottom: 1px solid rgba(200,169,110,0.08);
display: flex; align-items: center; justify-content: space-between;
flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #c8a96e, #7a5c14); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.logo-name { font-family: ‘Playfair Display’, serif; font-size: 1.2rem; font-weight: 700; }
.logo-badge { font-size: 0.68rem; color: #5a5448; background: rgba(200,169,110,0.06); border: 1px solid rgba(200,169,110,0.12); padding: 2px 8px; border-radius: 20px; }
#present-btn {
padding: 8px 18px; border-radius: 8px;
background: linear-gradient(135deg, #c8a96e, #8b6914);
border: none; color: #1a1510; font-weight: 700; cursor: pointer; font-size: 0.85rem;
font-family: ‘DM Sans’, sans-serif; display: none;
}
#present-btn:hover { opacity: 0.9; }

/* MAIN LAYOUT */
.main { flex: 1; display: flex; overflow: hidden; }

/* LEFT PANEL */
.left-panel {
width: 300px; min-width: 260px;
border-right: 1px solid rgba(200,169,110,0.08);
display: flex; flex-direction: column;
padding: 24px; gap: 20px; overflow-y: auto;
}

/* MIC AREA */
.mic-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#mic-btn {
width: 88px; height: 88px; border-radius: 50%; border: none; cursor: pointer; font-size: 2rem;
background: linear-gradient(135deg, #c8a96e, #7a5c14);
box-shadow: 0 8px 32px rgba(200,169,110,0.2);
transition: all 0.3s; outline: none;
}
#mic-btn.listening {
background: linear-gradient(135deg, #e06060, #9b2020);
animation: pulse 2s infinite;
}
#mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status-row { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#status-label { font-size: 0.85rem; font-weight: 600; color: #5a5448; transition: color 0.3s; }

.waveform { display: flex; gap: 3px; align-items: center; height: 24px; }
.wave-bar {
width: 3px; border-radius: 2px; background: #2a2418; height: 4px;
transition: background 0.3s;
}
.waveform.active .wave-bar {
background: #c8a96e;
animation: wave 0.5s ease-in-out infinite alternate;
}

.hint { color: #5a5448; font-size: 0.78rem; text-align: center; line-height: 1.5; }
#error-box { display: none; color: #e06060; font-size: 0.78rem; text-align: center; background: rgba(224,96,96,0.07); border: 1px solid rgba(224,96,96,0.2); padding: 10px; border-radius: 8px; }

/* TRANSCRIPT */
.section-label { font-size: 0.72rem; color: #3a3328; text-transform: uppercase; letter-spacing: 0.1em; }
#transcript-box {
display: none; flex-direction: column; gap: 8px;
}
#transcript-content {
background: rgba(200,169,110,0.03); border: 1px solid rgba(200,169,110,0.08);
border-radius: 10px; padding: 14px; font-size: 0.82rem; line-height: 1.6;
max-height: 180px; overflow-y: auto; color: #7a7264;
}
#live-text { color: rgba(200,169,110,0.7); }

/* SLIDE HISTORY */
#history-box { display: none; flex-direction: column; gap: 8px; }
#history-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
.history-item {
background: rgba(200,169,110,0.03); border: 1px solid rgba(200,169,110,0.08);
border-radius: 8px; padding: 10px 12px; cursor: pointer;
display: flex; justify-content: space-between; align-items: center;
transition: all 0.2s; text-align: left; width: 100%;
}
.history-item:hover, .history-item.active {
background: rgba(200,169,110,0.1); border-color: rgba(200,169,110,0.3);
}
.history-title { color: #d4cfc5; font-size: 0.82rem; font-weight: 600; }
.history-layout { color: #c8a96e; font-size: 0.68rem; background: rgba(200,169,110,0.1); padding: 1px 6px; border-radius: 4px; }

/* RIGHT PANEL */
.right-panel {
flex: 1; display: flex; flex-direction: column;
align-items: center; justify-content: center;
padding: 32px; gap: 20px; position: relative; overflow: hidden;
}
.right-panel::before {
content: ‘’; position: absolute; inset: 0;
background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(200,169,110,0.03) 0%, transparent 70%);
animation: glow 4s ease-in-out infinite; pointer-events: none;
}

/* SLIDE CANVAS */
#slide-canvas {
width: 100%; max-width: 800px; aspect-ratio: 16/9;
background: linear-gradient(145deg, #1a1510 0%, #141009 100%);
border-radius: 16px; border: 1px solid rgba(200,169,110,0.12);
box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,169,110,0.04);
overflow: hidden; position: relative;
display: flex; align-items: center; justify-content: center;
}
#slide-canvas::before {
content: ‘’; position: absolute; top: 0; left: 0; right: 0; height: 1px;
background: linear-gradient(90deg, transparent, rgba(200,169,110,0.25), transparent);
}

#slide-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; }

#empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0.35; }
.empty-frame { width: 100px; height: 70px; border-radius: 8px; border: 2px dashed rgba(200,169,110,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }

#generating-badge {
display: none; position: absolute; top: 14px; right: 14px;
align-items: center; gap: 6px;
}
.spinner { width: 16px; height: 16px; border: 2px solid rgba(200,169,110,0.2); border-top-color: #c8a96e; border-radius: 50%; animation: spin 0.7s linear infinite; }
#generating-badge span { color: #c8a96e; font-size: 0.72rem; }

/* LAYOUTS LEGEND */
.layouts-legend { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.layout-tag { font-size: 0.68rem; color: #3a3328; background: rgba(200,169,110,0.04); border: 1px solid rgba(200,169,110,0.07); padding: 3px 8px; border-radius: 4px; }

/* ── SLIDE CONTENT STYLES ── */
.slide-title {
font-family: ‘Playfair Display’, serif; font-weight: 700; color: #f0ece3;
line-height: 1.15; text-align: center;
text-shadow: 0 0 60px rgba(240,200,100,0.15);
}
.slide-subtitle { font-size: 1rem; color: #a09880; font-style: italic; text-align: center; }

/* bullets */
.bullets-list { list-style: none; display: flex; flex-direction: column; gap: 8px; text-align: left; max-width: 500px; }
.bullets-list li { display: flex; align-items: flex-start; gap: 10px; color: #d4cfc5; font-size: 0.95rem; line-height: 1.4; }
.bullets-list li::before { content: ‘›’; color: #c8a96e; font-size: 1.2rem; flex-shrink: 0; }

/* metric */
.metric-value { font-family: ‘Playfair Display’, serif; font-size: clamp(2.5rem,7vw,5rem); font-weight: 800; color: #c8a96e; line-height: 1; animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
.metric-label { font-size: 1rem; color: #a09880; }
.metric-change { font-size: 0.85rem; color: #7ecb8f; background: rgba(126,203,143,0.1); padding: 2px 10px; border-radius: 20px; }

/* steps */
.steps-wrap { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
.step-item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1 1 110px; }
.step-num { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #c8a96e, #8b6914); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #1a1510; }
.step-text { font-size: 0.85rem; color: #d4cfc5; text-align: center; }

/* quote */
.quote-text { font-family: ‘Playfair Display’, serif; font-size: clamp(1rem,2.5vw,1.3rem); color: #e8e2d8; font-style: italic; line-height: 1.6; text-align: center; max-width: 520px; }
.quote-author { color: #7a7264; font-size: 0.85rem; text-align: center; }

/* team */
.team-wrap { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.team-card { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.team-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #f0ece3; font-weight: 700; border: 2px solid rgba(200,169,110,0.3); }
.team-name { color: #f0ece3; font-size: 0.9rem; font-weight: 600; }
.team-role { color: #7a7264; font-size: 0.75rem; }

/* timeline */
.timeline-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 460px; text-align: left; }
.timeline-item { display: flex; gap: 14px; align-items: flex-start; }
.timeline-year { color: #c8a96e; font-size: 0.82rem; font-weight: 700; min-width: 40px; }
.timeline-event { flex: 1; border-left: 1px solid rgba(200,169,110,0.2); padding-left: 12px; color: #d4cfc5; font-size: 0.9rem; }

/* comparison */
.comparison-wrap { display: flex; gap: 14px; max-width: 560px; }
.comp-side { flex: 1; border-radius: 10px; padding: 14px; }
.comp-side.left { background: rgba(200,169,110,0.07); border: 1px solid rgba(200,169,110,0.2); }
.comp-side.right { background: rgba(126,203,143,0.07); border: 1px solid rgba(126,203,143,0.2); }
.comp-label { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
.comp-side.left .comp-label { color: #c8a96e; }
.comp-side.right .comp-label { color: #7ecb8f; }
.comp-point { color: #c8c3b8; font-size: 0.82rem; margin: 3px 0; }

/* ── PRESENT MODE ── */
#present-mode {
display: none; position: fixed; inset: 0; background: #0e0c09;
flex-direction: column; z-index: 1000;
}
#present-mode.active { display: flex; }
#present-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
#present-slide {
width: min(900px, 90vw); aspect-ratio: 16/9;
background: linear-gradient(145deg, #1a1510 0%, #141009 100%);
border-radius: 16px; border: 1px solid rgba(200,169,110,0.12);
box-shadow: 0 40px 120px rgba(0,0,0,0.8);
overflow: hidden; position: relative;
display: flex; align-items: center; justify-content: center;
}
#present-slide::before { content:’’; position:absolute; top:0; left:0; right:0; height:1px; background: linear-gradient(90deg, transparent, rgba(200,169,110,0.3), transparent); }
#present-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 48px; }
#present-bar {
display: flex; align-items: center; justify-content: space-between;
padding: 14px 28px; background: rgba(14,12,9,0.9);
backdrop-filter: blur(12px); border-top: 1px solid rgba(200,169,110,0.08);
flex-shrink: 0;
}
.bar-btns { display: flex; gap: 8px; }
.bar-btn {
padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer;
font-family: ‘DM Sans’, sans-serif; font-size: 0.82rem; font-weight: 600;
}
.btn-stop { background: rgba(224,96,96,0.15); color: #e06060; border: 1px solid rgba(224,96,96,0.3); }
.btn-start { background: rgba(126,203,143,0.15); color: #7ecb8f; border: 1px solid rgba(126,203,143,0.3); }
.btn-back { background: transparent; color: #a09880; border: 1px solid rgba(200,169,110,0.2); }
#slide-counter { color: #3a3328; font-size: 0.78rem; }

/* RESPONSIVE */
@media (max-width: 600px) {
.left-panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(200,169,110,0.08); max-height: 40vh; }
.main { flex-direction: column; }
.right-panel { padding: 16px; }
}

.slide-anim { animation: slideIn 0.4s cubic-bezier(0.16,1,0.3,1); }
.fade-item { opacity: 0; animation: fadeUp 0.4s forwards; }
</style>

</head>

<script>
const SYSTEM_PROMPT = `You are a real-time presentation AI. The user is speaking live. Based on their speech, generate ONE slide as JSON.

Return ONLY a JSON object with this structure:
{
  "layout": "tagline" | "bullets" | "metric" | "steps" | "quote" | "team" | "timeline" | "comparison",
  "title": "string",
  "subtitle": "string (optional)",
  "content": <depends on layout>
}

Layout content rules:
- tagline: content = null
- bullets: content = ["bullet 1", "bullet 2", "bullet 3"] (2-5 items)
- metric: content = { "value": "50M", "label": "active users", "change": "+12%" }
- steps: content = ["Step one", "Step two", "Step three"] (2-4 steps)
- quote: content = { "text": "The quote text", "author": "Name" }
- team: content = [{ "name": "Alice", "role": "CEO" }, { "name": "Bob", "role": "CTO" }]
- timeline: content = [{ "year": "2020", "event": "Founded" }, ...]
- comparison: content = { "left": { "label": "Option A", "points": ["p1","p2"] }, "right": { "label": "Option B", "points": ["p1","p2"] } }

Pick the layout that best matches what the speaker is saying.
If numbers → metric. Lists → bullets. Story/history → timeline. Comparing → comparison. Inspirational → quote. People → team. Process → steps. Opening/closing → tagline.

Respond ONLY with JSON. No markdown, no explanation, no backticks.`;

// ── State ──
let isListening = false;
let slides = [];
let currentSlideIdx = -1;
let transcript = "";
let bufferText = "";
let lastGenerated = "";
let generateTimer = null;
let recognition = null;

// ── DOM refs ──
const micBtn = document.getElementById('mic-btn');
const statusLabel = document.getElementById('status-label');
const waveform = document.getElementById('waveform');
const presentWaveform = document.getElementById('present-waveform');
const errorBox = document.getElementById('error-box');
const hintEl = document.getElementById('hint');
const transcriptBox = document.getElementById('transcript-box');
const transcriptText = document.getElementById('transcript-text');
const liveText = document.getElementById('live-text');
const historyBox = document.getElementById('history-box');
const historyList = document.getElementById('history-list');
const slideCount = document.getElementById('slide-count');
const slideInner = document.getElementById('slide-inner');
const emptyState = document.getElementById('empty-state');
const generatingBadge = document.getElementById('generating-badge');
const presentBtn = document.getElementById('present-btn');
const presentMode = document.getElementById('present-mode');
const presentInner = document.getElementById('present-inner');
const presentMicBtn = document.getElementById('present-mic-btn');
const backBtn = document.getElementById('back-btn');
const slideCounter = document.getElementById('slide-counter');
const presentStatus = document.getElementById('present-status');

// ── Init Speech Recognition ──
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    errorBox.textContent = "⚠️ Speech Recognition non supportato. Usa Chrome su desktop.";
    errorBox.style.display = 'block';
    micBtn.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'it-IT';

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) {
      bufferText += ' ' + final;
      transcript += ' ' + final;
      transcriptText.textContent = transcript;
      transcriptBox.style.display = 'flex';
    }
    liveText.textContent = interim ? ' ' + interim : '';

    clearTimeout(generateTimer);
    const wordCount = bufferText.trim().split(/\s+/).filter(Boolean).length;
    if (wordCount >= 5) {
      generateTimer = setTimeout(() => {
        const chunk = bufferText.trim();
        if (chunk && chunk !== lastGenerated) {
          generateSlide(chunk);
          lastGenerated = chunk;
          bufferText = '';
        }
      }, 2000);
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') {
      setStatus('error');
      errorBox.textContent = `Errore microfono: ${e.error}`;
      errorBox.style.display = 'block';
    }
  };

  recognition.onend = () => {
    if (isListening) recognition.start(); // auto-restart
  };
}

// ── Status ──
const statusColors = { idle: '#5a5448', listening: '#7ecb8f', generating: '#c8a96e', error: '#e06060' };
const statusTexts = { idle: 'Pronto', listening: 'In ascolto…', generating: 'Generando slide…', error: 'Errore' };

function setStatus(s) {
  statusLabel.textContent = statusTexts[s];
  statusLabel.style.color = statusColors[s];
  presentStatus.textContent = statusTexts[s];
  presentStatus.style.color = statusColors[s];
}

function setListeningUI(active) {
  isListening = active;
  micBtn.className = active ? 'listening' : '';
  micBtn.textContent = active ? '⏹' : '🎤';
  waveform.className = active ? 'waveform active' : 'waveform';
  presentWaveform.className = active ? 'waveform active' : 'waveform';
  presentMicBtn.className = active ? 'bar-btn btn-stop' : 'bar-btn btn-start';
  presentMicBtn.textContent = active ? '⏹ Stop' : '🎤 Parla';
  hintEl.style.display = active ? 'none' : 'block';
  if (active) setStatus('listening');
  else setStatus('idle');
}

// ── Toggle Mic ──
function toggleMic() {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
    setListeningUI(false);
    liveText.textContent = '';
  } else {
    transcript = '';
    bufferText = '';
    lastGenerated = '';
    slides = [];
    currentSlideIdx = -1;
    transcriptText.textContent = '';
    historyList.innerHTML = '';
    historyBox.style.display = 'none';
    presentBtn.style.display = 'none';
    slideCount.textContent = '0';
    slideCounter.textContent = 'Slide 0';
    showEmptyState();
    recognition.start();
    setListeningUI(true);
  }
}

micBtn.addEventListener('click', toggleMic);
presentMicBtn.addEventListener('click', toggleMic);

// ── Generate Slide ──
async function generateSlide(text) {
  generatingBadge.style.display = 'flex';
  setStatus('generating');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: `Speaker said: "${text}"` }]
      })
    });
    const data = await res.json();
    const raw = (data.content || []).map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const slide = JSON.parse(clean);
    slide.id = Date.now();
    slides.push(slide);
    currentSlideIdx = slides.length - 1;
    renderSlide(slide, slideInner);
    renderSlide(slide, presentInner);
    addToHistory(slide, currentSlideIdx);
    presentBtn.style.display = 'block';
    slideCount.textContent = slides.length;
    slideCounter.textContent = `Slide ${slides.length}`;
    emptyState && (emptyState.style.display = 'none');
    setStatus('listening');
  } catch(err) {
    console.error(err);
    setStatus('listening');
  } finally {
    generatingBadge.style.display = 'none';
  }
}

// ── Render Slide ──
function renderSlide(slide, container) {
  const { layout, title, subtitle, content } = slide;
  let html = `<div class="slide-anim" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;text-align:center;">`;

  const titleSize = layout === 'tagline' ? 'clamp(1.8rem,4.5vw,3rem)' : 'clamp(1.2rem,2.5vw,2rem)';
  html += `<h1 class="slide-title" style="font-size:${titleSize}">${esc(title)}</h1>`;
  if (subtitle) html += `<p class="slide-subtitle">${esc(subtitle)}</p>`;

  if (layout === 'bullets' && Array.isArray(content)) {
    html += `<ul class="bullets-list">`;
    content.forEach((b,i) => {
      html += `<li class="fade-item" style="animation-delay:${i*0.08}s">${esc(b)}</li>`;
    });
    html += `</ul>`;
  }

  if (layout === 'metric' && content) {
    html += `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <span class="metric-value">${esc(content.value||'')}</span>
      <span class="metric-label">${esc(content.label||'')}</span>
      ${content.change ? `<span class="metric-change">${esc(content.change)}</span>` : ''}
    </div>`;
  }

  if (layout === 'steps' && Array.isArray(content)) {
    html += `<div class="steps-wrap">`;
    content.forEach((s,i) => {
      html += `<div class="step-item fade-item" style="animation-delay:${i*0.1}s">
        <div class="step-num">${i+1}</div>
        <span class="step-text">${esc(s)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (layout === 'quote' && content) {
    html += `<div style="max-width:500px">
      <p class="quote-text"><span style="color:#c8a96e;font-size:2.5rem;line-height:0;vertical-align:-0.4em;margin-right:4px">"</span>${esc(content.text||'')}</p>
      ${content.author ? `<p class="quote-author" style="margin-top:12px">— ${esc(content.author)}</p>` : ''}
    </div>`;
  }

  if (layout === 'team' && Array.isArray(content)) {
    const colors = ['#3a2a4a','#1a3a2a','#3a2a1a','#1a2a3a'];
    html += `<div class="team-wrap">`;
    content.forEach((p,i) => {
      html += `<div class="team-card fade-item" style="animation-delay:${i*0.1}s">
        <div class="team-avatar" style="background:${colors[i%colors.length]}">${(p.name||'?')[0]}</div>
        <span class="team-name">${esc(p.name||'')}</span>
        <span class="team-role">${esc(p.role||'')}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (layout === 'timeline' && Array.isArray(content)) {
    html += `<div class="timeline-wrap">`;
    content.forEach((ev,i) => {
      html += `<div class="timeline-item fade-item" style="animation-delay:${i*0.08}s">
        <span class="timeline-year">${esc(ev.year||'')}</span>
        <span class="timeline-event">${esc(ev.event||'')}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (layout === 'comparison' && content) {
    html += `<div class="comparison-wrap">`;
    ['left','right'].forEach((side,i) => {
      const d = content[side]||{};
      html += `<div class="comp-side ${side} fade-item" style="animation-delay:${i*0.12}s">
        <div class="comp-label">${esc(d.label||'')}</div>
        ${(d.points||[]).map(p=>`<p class="comp-point">• ${esc(p)}</p>`).join('')}
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

function showEmptyState() {
  slideInner.innerHTML = `<div id="empty-state" class="empty-frame-wrap" style="display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0.35">
    <div class="empty-frame">🖼</div>
    <p style="color:#5a5448;font-size:0.82rem;text-align:center">Le slide appariranno qui mentre parli</p>
  </div>`;
}

function addToHistory(slide, idx) {
  historyBox.style.display = 'flex';
  const btn = document.createElement('button');
  btn.className = 'history-item active';
  btn.dataset.idx = idx;
  btn.innerHTML = `<span class="history-title">${esc(slide.title?.slice(0,28))}${(slide.title?.length||0)>28?'…':''}</span>
    <span class="history-layout">${esc(slide.layout)}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.history-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const s = slides[parseInt(btn.dataset.idx)];
    renderSlide(s, slideInner);
    renderSlide(s, presentInner);
  });
  document.querySelectorAll('.history-item').forEach(b => b.classList.remove('active'));
  historyList.appendChild(btn);
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Present Mode ──
presentBtn.addEventListener('click', () => {
  presentMode.classList.add('active');
  if (currentSlideIdx >= 0) renderSlide(slides[currentSlideIdx], presentInner);
});
backBtn.addEventListener('click', () => {
  presentMode.classList.remove('active');
});

// ── Init ──
initSpeech();
</script>
