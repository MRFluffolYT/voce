<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLIDE LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --panel: #0d1117;
    --border: #1e2530;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --text: #e8edf5;
    --muted: #4a5568;
    --slide-bg: #0d1117;
    --red: #ef4444;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
height: 100vh;
overflow: hidden;
display: flex;
flex-direction: column;
}

/* HEADER */
header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 28px;
border-bottom: 1px solid var(–border);
background: rgba(13,17,23,0.95);
backdrop-filter: blur(12px);
z-index: 100;
flex-shrink: 0;
}

.logo {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 26px;
letter-spacing: 4px;
background: linear-gradient(90deg, var(–accent), var(–accent2));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.logo span {
background: linear-gradient(90deg, var(–accent3), var(–red));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.status-bar {
display: flex;
align-items: center;
gap: 20px;
}

.slide-count {
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
color: var(–muted);
}

.slide-count span {
color: var(–accent);
font-weight: 700;
}

/* MAIN LAYOUT */
.main {
display: flex;
flex: 1;
overflow: hidden;
}

/* LEFT: SLIDE DISPLAY */
.slide-area {
flex: 1;
display: flex;
flex-direction: column;
padding: 24px;
gap: 16px;
overflow: hidden;
position: relative;
}

.slide-stage {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
position: relative;
}

.slide-frame {
width: 100%;
max-width: 780px;
aspect-ratio: 16/9;
background: var(–slide-bg);
border: 1px solid var(–border);
border-radius: 12px;
overflow: hidden;
position: relative;
box-shadow: 0 0 60px rgba(0,229,255,0.06), 0 24px 80px rgba(0,0,0,0.6);
transition: all 0.4s ease;
}

.slide-frame.generating {
border-color: var(–accent);
box-shadow: 0 0 80px rgba(0,229,255,0.15), 0 24px 80px rgba(0,0,0,0.6);
}

/* SLIDE CONTENT TYPES */
.slide-inner {
width: 100%;
height: 100%;
padding: 40px 52px;
display: flex;
flex-direction: column;
justify-content: center;
position: relative;
overflow: hidden;
animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideIn {
from { opacity: 0; transform: translateY(20px) scale(0.97); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

.slide-inner::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 3px;
background: linear-gradient(90deg, var(–accent), var(–accent2), transparent);
}

.slide-tag {
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
letter-spacing: 3px;
color: var(–accent);
text-transform: uppercase;
margin-bottom: 16px;
opacity: 0.7;
}

.slide-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(28px, 4.5vw, 52px);
letter-spacing: 2px;
line-height: 1.05;
color: #fff;
margin-bottom: 20px;
}

.slide-subtitle {
font-size: clamp(13px, 1.4vw, 17px);
color: rgba(232,237,245,0.65);
line-height: 1.65;
font-weight: 300;
max-width: 520px;
}

.slide-bullets {
list-style: none;
display: flex;
flex-direction: column;
gap: 12px;
margin-top: 8px;
}

.slide-bullets li {
display: flex;
align-items: flex-start;
gap: 12px;
font-size: clamp(12px, 1.3vw, 15px);
color: rgba(232,237,245,0.8);
line-height: 1.5;
}

.slide-bullets li::before {
content: ‘▸’;
color: var(–accent);
flex-shrink: 0;
margin-top: 1px;
}

.slide-stat {
display: flex;
gap: 36px;
margin-top: 12px;
flex-wrap: wrap;
}

.stat-item {
display: flex;
flex-direction: column;
gap: 4px;
}

.stat-value {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(28px, 3.5vw, 44px);
color: var(–accent);
letter-spacing: 2px;
}

.stat-label {
font-size: 11px;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 2px;
}

/* Decorative bg shapes */
.slide-deco {
position: absolute;
border-radius: 50%;
pointer-events: none;
}
.deco-1 {
width: 220px; height: 220px;
background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
right: -40px; top: -40px;
}
.deco-2 {
width: 160px; height: 160px;
background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
left: -20px; bottom: -20px;
}

/* EMPTY STATE */
.empty-state {
width: 100%; height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 16px;
opacity: 0.35;
}

.empty-icon {
font-size: 48px;
filter: grayscale(1);
}

.empty-text {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 20px;
letter-spacing: 4px;
color: var(–muted);
}

.empty-sub {
font-size: 13px;
color: var(–muted);
}

/* GENERATING OVERLAY */
.generating-overlay {
position: absolute;
inset: 0;
background: rgba(8,10,15,0.7);
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
backdrop-filter: blur(4px);
border-radius: 12px;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
flex-direction: column;
}

.generating-overlay.active {
opacity: 1;
pointer-events: auto;
}

.gen-text {
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
letter-spacing: 3px;
color: var(–accent);
text-transform: uppercase;
}

.gen-dots {
display: flex; gap: 6px;
}

.gen-dot {
width: 6px; height: 6px;
border-radius: 50%;
background: var(–accent);
animation: pulse 1.2s ease-in-out infinite;
}

.gen-dot:nth-child(2) { animation-delay: 0.2s; }
.gen-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
0%, 100% { transform: scale(0.6); opacity: 0.3; }
50% { transform: scale(1); opacity: 1; }
}

/* SLIDE THUMBNAILS */
.thumbnails {
display: flex;
gap: 10px;
overflow-x: auto;
padding: 8px 2px;
flex-shrink: 0;
scrollbar-width: thin;
scrollbar-color: var(–border) transparent;
}

.thumb {
flex-shrink: 0;
width: 120px;
height: 68px;
background: var(–panel);
border: 1px solid var(–border);
border-radius: 6px;
cursor: pointer;
overflow: hidden;
position: relative;
transition: all 0.2s;
display: flex;
align-items: center;
justify-content: center;
font-size: 9px;
padding: 8px;
text-align: center;
color: var(–muted);
font-family: ‘DM Sans’, sans-serif;
line-height: 1.4;
}

.thumb:hover { border-color: var(–accent); transform: translateY(-2px); }
.thumb.active { border-color: var(–accent); box-shadow: 0 0 16px rgba(0,229,255,0.2); }

.thumb::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 2px;
background: linear-gradient(90deg, var(–accent), var(–accent2));
opacity: 0;
transition: opacity 0.2s;
}

.thumb.active::before, .thumb:hover::before { opacity: 1; }

.thumb-num {
position: absolute;
top: 4px; right: 6px;
font-family: ‘JetBrains Mono’, monospace;
font-size: 8px;
color: var(–accent);
opacity: 0.6;
}

/* RIGHT PANEL */
.right-panel {
width: 320px;
border-left: 1px solid var(–border);
display: flex;
flex-direction: column;
background: var(–panel);
flex-shrink: 0;
}

.panel-section {
padding: 20px 20px 16px;
border-bottom: 1px solid var(–border);
}

.panel-label {
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
letter-spacing: 3px;
color: var(–muted);
text-transform: uppercase;
margin-bottom: 14px;
}

/* MIC BUTTON */
.mic-area {
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
padding: 24px 20px;
}

.mic-btn {
width: 80px; height: 80px;
border-radius: 50%;
background: var(–bg);
border: 2px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.3s ease;
position: relative;
font-size: 28px;
}

.mic-btn::before, .mic-btn::after {
content: ‘’;
position: absolute;
inset: -8px;
border-radius: 50%;
border: 1px solid var(–accent);
opacity: 0;
animation: ripple 2s ease-out infinite;
}

.mic-btn::after { animation-delay: 0.7s; }

@keyframes ripple {
0% { transform: scale(0.8); opacity: 0; }
40% { opacity: 0.4; }
100% { transform: scale(1.5); opacity: 0; }
}

.mic-btn.listening {
border-color: var(–accent);
background: rgba(0,229,255,0.08);
box-shadow: 0 0 40px rgba(0,229,255,0.2);
}

.mic-btn.listening::before, .mic-btn.listening::after {
border-color: var(–accent);
opacity: 1;
}

.mic-status {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
letter-spacing: 2px;
color: var(–muted);
text-align: center;
text-transform: uppercase;
}

.mic-status.active { color: var(–accent); }
.mic-status.error { color: var(–red); }

/* WAVEFORM */
.waveform {
display: flex;
align-items: center;
justify-content: center;
gap: 3px;
height: 36px;
}

.wave-bar {
width: 3px;
background: var(–accent);
border-radius: 2px;
height: 4px;
opacity: 0.3;
transition: height 0.1s ease;
}

.waveform.active .wave-bar {
opacity: 0.8;
animation: wave 0.8s ease-in-out infinite;
}

.waveform.active .wave-bar:nth-child(1) { animation-delay: 0s; }
.waveform.active .wave-bar:nth-child(2) { animation-delay: 0.1s; }
.waveform.active .wave-bar:nth-child(3) { animation-delay: 0.2s; }
.waveform.active .wave-bar:nth-child(4) { animation-delay: 0.1s; }
.waveform.active .wave-bar:nth-child(5) { animation-delay: 0.05s; }
.waveform.active .wave-bar:nth-child(6) { animation-delay: 0.15s; }
.waveform.active .wave-bar:nth-child(7) { animation-delay: 0.25s; }
.waveform.active .wave-bar:nth-child(8) { animation-delay: 0.1s; }
.waveform.active .wave-bar:nth-child(9) { animation-delay: 0.2s; }
.waveform.active .wave-bar:nth-child(10) { animation-delay: 0.05s; }

@keyframes wave {
0%, 100% { height: 4px; }
50% { height: 24px; }
}

/* TRANSCRIPT */
.transcript-box {
flex: 1;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 0;
scrollbar-width: thin;
scrollbar-color: var(–border) transparent;
}

.transcript-entry {
padding: 12px 20px;
border-bottom: 1px solid rgba(30,37,48,0.5);
transition: background 0.2s;
}

.transcript-entry:hover { background: rgba(255,255,255,0.02); }

.t-meta {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 5px;
}

.t-time {
font-family: ‘JetBrains Mono’, monospace;
font-size: 9px;
color: var(–muted);
}

.t-badge {
font-family: ‘JetBrains Mono’, monospace;
font-size: 8px;
letter-spacing: 1px;
padding: 2px 6px;
border-radius: 3px;
text-transform: uppercase;
}

.t-badge.voice { background: rgba(0,229,255,0.1); color: var(–accent); }
.t-badge.slide { background: rgba(124,58,237,0.15); color: #a78bfa; }

.t-text {
font-size: 12px;
color: rgba(232,237,245,0.7);
line-height: 1.5;
}

/* CONTROLS */
.controls {
display: flex;
gap: 8px;
padding: 12px 20px;
border-top: 1px solid var(–border);
}

.ctrl-btn {
flex: 1;
padding: 8px 12px;
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
border-radius: 6px;
cursor: pointer;
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
letter-spacing: 1px;
text-transform: uppercase;
transition: all 0.2s;
}

.ctrl-btn:hover {
border-color: var(–accent2);
color: #a78bfa;
background: rgba(124,58,237,0.08);
}

.ctrl-btn.danger:hover {
border-color: var(–red);
color: var(–red);
background: rgba(239,68,68,0.08);
}

/* SCANNING LINE EFFECT */
@keyframes scan {
0% { transform: translateY(-100%); }
100% { transform: translateY(100vh); }
}

.scan-line {
position: fixed;
left: 0; right: 0;
height: 1px;
background: linear-gradient(90deg, transparent, rgba(0,229,255,0.15), transparent);
pointer-events: none;
animation: scan 4s linear infinite;
z-index: 1000;
}

/* Noise overlay */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’/%3E%3C/svg%3E”);
opacity: 0.025;
pointer-events: none;
z-index: 999;
}

/* Tooltip */
.tooltip {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
background: rgba(0,229,255,0.1);
border: 1px solid var(–accent);
color: var(–accent);
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
padding: 8px 16px;
border-radius: 6px;
letter-spacing: 1px;
pointer-events: none;
opacity: 0;
transition: opacity 0.3s;
z-index: 500;
white-space: nowrap;
}

.tooltip.show { opacity: 1; }

/* No speech API fallback */
.no-speech {
display: none;
padding: 20px;
text-align: center;
color: var(–red);
font-size: 13px;
line-height: 1.6;
}

.manual-input {
display: flex;
gap: 8px;
padding: 12px 20px;
border-bottom: 1px solid var(–border);
}

.manual-input input {
flex: 1;
background: var(–bg);
border: 1px solid var(–border);
color: var(–text);
padding: 8px 12px;
border-radius: 6px;
font-family: ‘DM Sans’, sans-serif;
font-size: 13px;
outline: none;
transition: border-color 0.2s;
}

.manual-input input:focus { border-color: var(–accent); }

.manual-input button {
background: var(–accent);
color: #000;
border: none;
padding: 8px 14px;
border-radius: 6px;
cursor: pointer;
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
font-weight: 700;
transition: opacity 0.2s;
}

.manual-input button:hover { opacity: 0.8; }
</style>

</head>

<script>
// ─── STATE ──────────────────────────────────────────────
let slides = [];
let currentSlideIndex = -1;
let isListening = false;
let isGenerating = false;
let recognition = null;
let sessionStart = Date.now();
let sessionTimer = null;
let accumulatedText = '';
let silenceTimer = null;
const SILENCE_DELAY = 2200; // ms of silence before generating

// ─── INIT ────────────────────────────────────────────────
function init() {
  startSessionTimer();
  initSpeechRecognition();
}

function startSessionTimer() {
  sessionTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('sessionTime').textContent = `${m}:${s}`;
  }, 1000);
}

// ─── SPEECH RECOGNITION ──────────────────────────────────
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('micStatus').textContent = 'USA IL CAMPO TESTO';
    document.getElementById('micStatus').className = 'mic-status error';
    document.getElementById('micBtn').style.opacity = '0.4';
    document.getElementById('micBtn').style.cursor = 'default';
    document.getElementById('micBtn').onclick = null;
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'it-IT';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }

    if (final) {
      accumulatedText += ' ' + final.trim();
      addTranscriptEntry(final.trim(), 'voice');

      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (accumulatedText.trim().length > 10) {
          const textToProcess = accumulatedText.trim();
          accumulatedText = '';
          generateSlide(textToProcess);
        }
      }, SILENCE_DELAY);
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showTooltip('Microfono non autorizzato. Usa il campo testo.');
      setMicOff();
    }
  };

  recognition.onend = () => {
    if (isListening) {
      // Restart
      try { recognition.start(); } catch(err) {}
    }
  };
}

function toggleListening() {
  if (!recognition) return;
  isListening ? stopListening() : startListening();
}

function startListening() {
  isListening = true;
  recognition.start();
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micBtn').textContent = '⏹';
  document.getElementById('waveform').classList.add('active');
  document.getElementById('micStatus').textContent = 'IN ASCOLTO...';
  document.getElementById('micStatus').className = 'mic-status active';
}

function stopListening() {
  isListening = false;
  try { recognition.stop(); } catch(e) {}
  setMicOff();
  clearTimeout(silenceTimer);
  if (accumulatedText.trim().length > 10) {
    const t = accumulatedText.trim();
    accumulatedText = '';
    generateSlide(t);
  }
}

function setMicOff() {
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micBtn').textContent = '🎤';
  document.getElementById('waveform').classList.remove('active');
  document.getElementById('micStatus').textContent = 'PREMI PER PARLARE';
  document.getElementById('micStatus').className = 'mic-status';
}

// ─── MANUAL INPUT ─────────────────────────────────────────
function sendManual() {
  const input = document.getElementById('manualText');
  const text = input.value.trim();
  if (!text || isGenerating) return;
  input.value = '';
  addTranscriptEntry(text, 'voice');
  generateSlide(text);
}

// ─── GENERATE SLIDE VIA GROQ API ─────────────────────────
const GROQ_API_KEY = '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';
const GROQ_MODEL   = 'llama-3.3-70b-versatile';

async function generateSlide(text) {
  if (isGenerating) return;
  isGenerating = true;

  document.getElementById('slideFrame').classList.add('generating');
  document.getElementById('genOverlay').classList.add('active');

  const systemPrompt = `Sei un generatore di slide visive. L'utente parla e tu crei una slide professionale basata su ciò che dice.

Rispondi SOLO con un oggetto JSON valido (nessun testo prima o dopo, nessun markdown), con questa struttura:
{
  "type": "title|bullets|stats|quote",
  "tag": "una parola chiave tematica in maiuscolo (es: AI, MARKETING, SCIENZA)",
  "title": "Titolo della slide (massimo 7 parole, impattante)",
  "subtitle": "Sottotitolo o descrizione (solo per type: title, massimo 20 parole)",
  "bullets": ["punto 1", "punto 2", "punto 3"],
  "stats": [{"value": "95%", "label": "CRESCITA"}],
  "quote": "citazione o frase chiave"
}

Scegli il tipo più adatto al contenuto:
- title: per introduzioni o argomenti generali
- bullets: per elenchi, processi, caratteristiche
- stats: per numeri, dati, performance
- quote: per citazioni, principi, filosofie

Parla sempre in italiano. Slide brevi, impattanti, visive.`;

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        max_tokens: 1000,
        temperature: 0.7,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: `Crea una slide per questo contenuto: "${text}"` }
        ]
      })
    });

    const data = await response.json();
    const raw = data.choices?.[0]?.message?.content || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    let slideData;
    try { slideData = JSON.parse(clean); }
    catch(e) {
      slideData = {
        type: 'title',
        tag: 'LIVE',
        title: text.split(' ').slice(0, 6).join(' '),
        subtitle: text
      };
    }

    addSlide(slideData, text);
    addTranscriptEntry(`Slide: "${slideData.title}"`, 'slide');

  } catch (err) {
    showTooltip('Errore API Groq. Riprova.');
    addSlide({
      type: 'title',
      tag: 'LIVE',
      title: text.split(' ').slice(0, 5).join(' ') || 'NUOVA SLIDE',
      subtitle: text
    }, text);
  }

  isGenerating = false;
  document.getElementById('slideFrame').classList.remove('generating');
  document.getElementById('genOverlay').classList.remove('active');
}

// ─── RENDER SLIDE ─────────────────────────────────────────
function renderSlideHTML(s) {
  const deco = `<div class="slide-deco deco-1"></div><div class="slide-deco deco-2"></div>`;

  if (s.type === 'title') {
    return `${deco}
      <div class="slide-tag">${s.tag || 'LIVE'}</div>
      <div class="slide-title">${s.title}</div>
      ${s.subtitle ? `<div class="slide-subtitle">${s.subtitle}</div>` : ''}`;
  }

  if (s.type === 'bullets') {
    const items = (s.bullets || []).map(b => `<li>${b}</li>`).join('');
    return `${deco}
      <div class="slide-tag">${s.tag || 'LIVE'}</div>
      <div class="slide-title">${s.title}</div>
      <ul class="slide-bullets">${items}</ul>`;
  }

  if (s.type === 'stats') {
    const items = (s.stats || []).map(st =>
      `<div class="stat-item"><div class="stat-value">${st.value}</div><div class="stat-label">${st.label}</div></div>`
    ).join('');
    return `${deco}
      <div class="slide-tag">${s.tag || 'DATI'}</div>
      <div class="slide-title">${s.title}</div>
      <div class="slide-stat">${items}</div>`;
  }

  if (s.type === 'quote') {
    return `${deco}
      <div class="slide-tag">${s.tag || 'CITAZIONE'}</div>
      <div class="slide-title" style="font-size:clamp(18px,2.8vw,34px); color: var(--accent); font-family: 'DM Sans'; font-weight:300; line-height:1.4; letter-spacing:0">"${s.quote || s.title}"</div>
      ${s.title && s.quote ? `<div class="slide-subtitle" style="margin-top:16px">— ${s.title}</div>` : ''}`;
  }

  return `${deco}<div class="slide-title">${s.title}</div>`;
}

function addSlide(slideData, rawText) {
  slides.push({ data: slideData, text: rawText });
  currentSlideIndex = slides.length - 1;

  document.getElementById('slideCountDisplay').textContent = slides.length;

  // Render main slide
  const content = document.getElementById('slideContent');
  content.innerHTML = renderSlideHTML(slideData);

  // Add thumbnail
  addThumbnail(slideData, currentSlideIndex);
}

function addThumbnail(slideData, index) {
  const container = document.getElementById('thumbsContainer');
  const thumb = document.createElement('div');
  thumb.className = 'thumb active';
  thumb.id = `thumb-${index}`;
  thumb.innerHTML = `<span class="thumb-num">${index + 1}</span><span>${slideData.title.substring(0, 40)}</span>`;
  thumb.onclick = () => selectSlide(index);

  // Deactivate previous
  container.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  container.appendChild(thumb);
  thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'end' });
}

function selectSlide(index) {
  if (index < 0 || index >= slides.length) return;
  currentSlideIndex = index;
  const content = document.getElementById('slideContent');
  content.innerHTML = renderSlideHTML(slides[index].data);

  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
}

// ─── TRANSCRIPT ───────────────────────────────────────────
function addTranscriptEntry(text, type) {
  const box = document.getElementById('transcriptBox');
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  const entry = document.createElement('div');
  entry.className = 'transcript-entry';
  entry.innerHTML = `
    <div class="t-meta">
      <span class="t-time">${time}</span>
      <span class="t-badge ${type}">${type === 'voice' ? 'VOCE' : 'SLIDE'}</span>
    </div>
    <div class="t-text">${text}</div>
  `;
  box.appendChild(entry);
  box.scrollTop = box.scrollHeight;
}

// ─── TOOLTIP ──────────────────────────────────────────────
function showTooltip(msg) {
  const t = document.getElementById('tooltip');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── EXPORT ───────────────────────────────────────────────
function exportSlides() {
  if (slides.length === 0) { showTooltip('Nessuna slide da esportare'); return; }
  const data = slides.map((s, i) => `SLIDE ${i+1}: ${s.data.title}\n${s.text}`).join('\n\n---\n\n');
  const blob = new Blob([data], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `slide-live-${Date.now()}.txt`;
  a.click();
  showTooltip('Esportazione completata!');
}

function clearAll() {
  slides = [];
  currentSlideIndex = -1;
  accumulatedText = '';
  document.getElementById('slideCountDisplay').textContent = '0';
  document.getElementById('slideContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎤</div>
      <div class="empty-text">PRONTO AD ASCOLTARE</div>
      <div class="empty-sub">Premi il microfono e inizia a parlare</div>
    </div>`;
  document.getElementById('thumbsContainer').innerHTML = '';
  document.getElementById('transcriptBox').innerHTML = '';
  if (isListening) stopListening();
  showTooltip('Reset completato');
}

// ─── START ────────────────────────────────────────────────
init();
</script>
